name: Standalone Education Content CI

on:
  push:
    branches:
      - rebuild/education-engine-adapter
      - rebuild/content-qa
      - rebuild/phase1-standalone-prep
      - rebuild/learning-session-core-v2
      - rebuild/coin-learning-selector
    paths:
      - "game/src/serverStorage/Pips*.lua"
      - "scripts/*pips*.luau"
      - "scripts/*release-question*.luau"
      - "tests/pips*.luau"
      - "scripts/verify-server-only-education.mjs"
      - ".github/workflows/standalone-education-content-ci.yml"

  pull_request:
    branches:
      - rebuild/maze-world-foundation

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Luau 0.740
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error             https://github.com/luau-lang/luau/releases/download/0.740/luau-ubuntu.zip             --output /tmp/luau.zip
          echo "7d4035db01816f977f6e4c42e3d5e8ef4235d95e9afe63a3c38905b42dde60f2  /tmp/luau.zip" | sha256sum -c -
          mkdir -p /tmp/luau
          unzip -q /tmp/luau.zip -d /tmp/luau
          chmod +x /tmp/luau/luau /tmp/luau/luau-compile

      - name: Guard server-only authority and Maze World foundation
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-server-only-education.mjs
          git fetch --no-tags origin rebuild/maze-world-foundation
          git diff --exit-code origin/rebuild/maze-world-foundation -- \
            game/maze-world.rbxl \
            game/Place.rbxmx \
            game/PlaceTerrain.rbxmx \
            game/src/common/Maze.lua \
            game/src/common/MazeGenerator.lua \
            game/src/common/TouchItem.lua \
            game/src/common/TagItem.lua \
            game/src/common/thunks/startGame.lua \
            game/src/common/thunks/startRoomGameLoop.lua \
            game/src/common/thunks/playerFinishedRoom.lua \
            game/src/client/Components/Room.lua \
            game/src/client/Components/FinishScreen.lua

      - name: Compile standalone Pips modules
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            /tmp/luau/luau-compile "$file" >/dev/null
          done < <(find game/src/serverStorage -maxdepth 1 -type f -name 'Pips*.lua' -print0)

      - name: Run standalone education tests when present
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/test-pips-education-engine.luau ]; then
            /tmp/luau/luau-compile scripts/test-pips-education-engine.luau >/dev/null
            /tmp/luau/luau scripts/test-pips-education-engine.luau
          fi
          if [ -f tests/pips_education_engine_smoke.luau ]; then
            /tmp/luau/luau-compile tests/pips_education_engine_smoke.luau >/dev/null
            /tmp/luau/luau tests/pips_education_engine_smoke.luau
          fi
          if [ -f tests/pips_education_content_contract.luau ]; then
            /tmp/luau/luau-compile tests/pips_education_content_contract.luau >/dev/null
            /tmp/luau/luau tests/pips_education_content_contract.luau
          fi
          if [ -f tests/pips_learning_session_smoke.luau ]; then
            /tmp/luau/luau-compile tests/pips_learning_session_smoke.luau >/dev/null
            /tmp/luau/luau tests/pips_learning_session_smoke.luau
          fi
          if [ -f tests/pips_learning_coin_selector_smoke.luau ]; then
            /tmp/luau/luau-compile tests/pips_learning_coin_selector_smoke.luau >/dev/null
            /tmp/luau/luau tests/pips_learning_coin_selector_smoke.luau
          fi

      - name: Run curated content tests when present
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/test-release-question-bank.luau ]; then
            /tmp/luau/luau-compile scripts/test-release-question-bank.luau >/dev/null
            /tmp/luau/luau scripts/test-release-question-bank.luau
          fi
