name: High School Mapped Build Preflight

on:
  pull_request:
    branches: [rebuild/high-school-foundation]
    paths:
      - 'school/**'
      - 'scripts/verify-school-build.py'
      - '.github/workflows/high-school-build-preflight.yml'
  push:
    branches: [rebuild/high-school-foundation]
    paths:
      - 'school/**'
      - 'scripts/verify-school-build.py'
      - '.github/workflows/high-school-build-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mapped-compile-and-place-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate fail-closed source inventory
        run: python3 scripts/verify-school-build.py --self-test
      - name: Install pinned and hash-verified validation tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rhs2-tools/luau" "$RUNNER_TEMP/rhs2-tools/rojo" "$RUNNER_TEMP/rhs2-build-validation"
          cd "$RUNNER_TEMP/rhs2-tools"
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 120 \
            https://github.com/luau-lang/luau/releases/download/0.741/luau-ubuntu.zip -o luau.zip
          echo '134dc762ad26232af83e43f98dec03ff6030dd3a4452f9408b9d50ccea025503  luau.zip' | sha256sum -c -
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 120 \
            https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  rojo.zip' | sha256sum -c -
          unzip -q luau.zip -d luau
          unzip -q rojo.zip -d rojo
          chmod +x luau/luau-compile rojo/rojo
          sha256sum luau.zip rojo.zip > "$RUNNER_TEMP/rhs2-build-validation/tool-archives.sha256"
      - name: Preserve exact-source offline diagnosis bundle
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz HEAD school scripts .github/workflows \
            > "$RUNNER_TEMP/rhs2-build-validation/source-snapshot.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/rhs2-build-validation/source-commit.txt"
          cp "$RUNNER_TEMP/rhs2-tools/luau.zip" "$RUNNER_TEMP/rhs2-tools/rojo.zip" "$RUNNER_TEMP/rhs2-build-validation/"
      - name: Compile every mapped source and construct validation-only place
        shell: bash
        run: |
          python3 scripts/verify-school-build.py \
            --expected-sha "$SOURCE_SHA" \
            --compiler "$RUNNER_TEMP/rhs2-tools/luau/luau-compile" \
            --rojo "$RUNNER_TEMP/rhs2-tools/rojo/rojo" \
            --out "$RUNNER_TEMP/rhs2-build-validation"
      - name: Preserve diagnostics and validation-only build
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: rhs2-build-validation-${{ github.run_id }}
          path: ${{ runner.temp }}/rhs2-build-validation/
          retention-days: 7
          if-no-files-found: warn
