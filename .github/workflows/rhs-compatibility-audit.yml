name: RHS Compatibility Audit

on:
  pull_request:
    paths:
      - "rhs/**"
      - "scripts/rhs-compatibility-audit.py"
      - ".github/workflows/rhs-compatibility-audit.yml"

permissions:
  contents: read

jobs:
  compatibility-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify exact baseline before analysis
        run: python3 scripts/verify-rhs-baseline.py

      - name: Build pinned Roblox binary converter
        shell: bash
        run: |
          set -euo pipefail
          cargo install --git https://github.com/rojo-rbx/rbx-dom.git             --rev 43d1f129f2eb1fd055512f039863ff35ae5a10f1             --locked rbx_util

      - name: Convert working copy to XML
        shell: bash
        run: |
          set -euo pipefail
          rbx-util convert "rhs/working/ROBLOX High School.rbxl" /tmp/rhs-working.rbxlx

      - name: Locate compatibility-sensitive scripts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/rhs-compatibility-audit.py             --xml /tmp/rhs-working.rbxlx             --output /tmp/rhs-compatibility-report.json

      - name: Upload compatibility report
        uses: actions/upload-artifact@v4
        with:
          name: rhs-compatibility-report
          path: /tmp/rhs-compatibility-report.json
          if-no-files-found: error
          retention-days: 30
