name: RHS Phone Text Context

on:
  push:
    branches:
      - audit/rhs-phone-text-trust-v3
    paths:
      - ".github/workflows/rhs-phone-text-context.yml"

permissions:
  contents: read

jobs:
  context:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable baseline
        run: python3 scripts/verify-rhs-baseline.py
      - name: Build pinned Roblox converter
        shell: bash
        run: |
          set -euo pipefail
          cargo install --git https://github.com/rojo-rbx/rbx-dom.git \
            --rev 43d1f129f2eb1fd055512f039863ff35ae5a10f1 \
            --locked rbx_util
      - name: Convert working build
        run: rbx-util convert "rhs/working/ROBLOX High School.rbxl" /tmp/rhs-working.rbxlx
      - name: Print phone/text server and caller context
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import xml.etree.ElementTree as ET

          root=ET.parse("/tmp/rhs-working.rbxlx").getroot()
          script_classes={"Script","LocalScript","ModuleScript"}

          def prop_text(item,name):
              props=item.find("Properties")
              if props is None: return ""
              for p in props:
                  if p.attrib.get("name")!=name: continue
                  if p.tag=="Content":
                      child=next(iter(p),None)
                      return (child.text or "") if child is not None else ""
                  return p.text or ""
              return ""

          def item_name(item): return prop_text(item,"Name") or "(unnamed)"
          def walk(parent,prefix=""):
              for item in parent.findall("Item"):
                  nm=item_name(item).replace("/","_")
                  path=f"{prefix}/{nm}" if prefix else nm
                  yield item,path
                  yield from walk(item,path)

          target="ServerScriptService/PhoneTextingScript"
          remotes={"SendTextMessage","ToggleBlockedPhoneContact"}
          for item,path in walk(root):
              if path==target:
                  source=prop_text(item,"Source")
                  print("=== PHONE_TEXT_SERVER ===")
                  print("SOURCE_SHA256",hashlib.sha256(source.encode()).hexdigest())
                  for i,line in enumerate(source.splitlines(),1):
                      print(f"{i:04d}: {line}")
                  print("=== END_PHONE_TEXT_SERVER ===")
                  break

          print("=== PHONE_TEXT_REFS ===")
          for item,path in walk(root):
              cls=item.attrib.get("class","")
              if cls not in script_classes or path==target: continue
              source=prop_text(item,"Source")
              if not source: continue
              lines=source.splitlines()
              hits=[i for i,line in enumerate(lines,1) if any(("RemoteFunctions."+r) in line for r in remotes)]
              if not hits: continue
              print("REF_SCRIPT",cls,path)
              shown=set()
              for center in hits:
                  for n in range(max(1,center-20),min(len(lines),center+30)+1):
                      if n in shown: continue
                      shown.add(n)
                      print(f"{n:04d}: {lines[n-1]}")
                  print("---")
          print("=== END_PHONE_TEXT_REFS ===")

          print("=== TEXT_FILTER_REFS ===")
          for item,path in walk(root):
              cls=item.attrib.get("class","")
              if cls not in script_classes: continue
              source=prop_text(item,"Source")
              if not source: continue
              if any(t in source for t in ("FilterStringAsync","FilterStringForBroadcast","FilterStringForPlayerAsync","TextService")):
                  print("FILTER_SCRIPT",cls,path)
                  for i,line in enumerate(source.splitlines(),1):
                      if any(t in line for t in ("FilterStringAsync","FilterStringForBroadcast","FilterStringForPlayerAsync","TextService")):
                          for n in range(max(1,i-10),min(len(source.splitlines()),i+16)+1):
                              print(f"{n:04d}: {source.splitlines()[n-1]}")
                          print("---")
          print("=== END_TEXT_FILTER_REFS ===")
          PY
