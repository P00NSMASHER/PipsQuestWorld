name: RHS Text Filtering Context Audit

on:
  push:
    branches:
      - audit/rhs-dynamic-code-loading
    paths:
      - "scripts/rhs-text-filter-context-audit.py"
      - ".github/workflows/rhs-text-filter-context-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify working identity
        run: python3 scripts/verify-rhs-baseline.py
      - name: Build pinned Roblox converter
        shell: bash
        run: |
          set -euo pipefail
          cargo install --git https://github.com/rojo-rbx/rbx-dom.git \
            --rev 43d1f129f2eb1fd055512f039863ff35ae5a10f1 \
            --locked rbx_util
      - name: Convert working build
        run: rbx-util convert "rhs/working/ROBLOX High School.rbxl" /tmp/rhs-working.rbxlx
      - name: Print text-filter review contexts
        run: python3 scripts/rhs-text-filter-context-audit.py --xml /tmp/rhs-working.rbxlx
