name: Emma Mesh Furniture Review Place

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'school/emma-mesh-review.project.json'
      - 'school/emma-classroom/mesh/FurnitureMeshReviewConfig.lua'
      - 'school/emma-classroom/mesh/verify_mesh_review.py'
      - '.github/workflows/emma-mesh-review-place.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-mesh-enabled-review-place-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install checksum-pinned Roblox project tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tools/luau" "$RUNNER_TEMP/tools/rojo"
          cd "$RUNNER_TEMP/tools"
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 120 \
            https://github.com/luau-lang/luau/releases/download/0.741/luau-ubuntu.zip -o luau.zip
          echo '134dc762ad26232af83e43f98dec03ff6030dd3a4452f9408b9d50ccea025503  luau.zip' | sha256sum -c -
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 120 \
            https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  rojo.zip' | sha256sum -c -
          unzip -q luau.zip -d luau
          unzip -q rojo.zip -d rojo
          chmod +x luau/luau-compile rojo/rojo

      - name: Prove approved GLB-only activation cannot enter production place
        shell: bash
        run: |
          set -euo pipefail
          python3 school/emma-classroom/mesh/verify_mesh_review.py
          python3 school/emma-classroom/showroom/verify_build.py
          "$RUNNER_TEMP/tools/luau/luau-compile" \
            school/emma-classroom/mesh/FurnitureMeshReviewConfig.lua > /dev/null

      - name: Build approved furniture review Roblox place without uploading it anywhere
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/tools/rojo/rojo" build school/emma-mesh-review.project.json \
            -o "$RUNNER_TEMP/emma-furniture-review.rbxl"
          "$RUNNER_TEMP/tools/rojo/rojo" build school/emma-mesh-review.project.json \
            -o "$RUNNER_TEMP/emma-furniture-review.rbxlx"
          test -s "$RUNNER_TEMP/emma-furniture-review.rbxl"
          test -s "$RUNNER_TEMP/emma-furniture-review.rbxlx"
          python3 school/emma-classroom/mesh/verify_mesh_review.py \
            "$RUNNER_TEMP/emma-furniture-review.rbxlx"
          python3 school/emma-classroom/showroom/verify_build.py \
            "$RUNNER_TEMP/emma-furniture-review.rbxlx"
          sha256sum "$RUNNER_TEMP"/emma-furniture-review.rbxl*

      - name: Retain private mesh-preview Roblox Studio candidate
        uses: actions/upload-artifact@v4
        with:
          name: emma-mesh-furniture-review-${{ github.sha }}
          path: |
            ${{ runner.temp }}/emma-furniture-review.rbxl
            ${{ runner.temp }}/emma-furniture-review.rbxlx
          retention-days: 21
          if-no-files-found: error
