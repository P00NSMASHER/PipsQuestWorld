name: Active Direction Guard

on:
  pull_request:
    paths:
      - "README.md"
      - "STATUS.md"
      - "AGENTS.md"
      - "DEVELOPMENT.md"
      - "docs/**"
      - ".github/workflows/**"
      - "scripts/verify-active-direction.py"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  direction:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reject retired-direction reactivation
        run: python3 scripts/verify-active-direction.py
