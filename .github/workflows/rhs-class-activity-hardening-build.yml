name: RHS Class Activity Hardening Build

on:
  push:
    branches:
      - rebuild/rhs-class-activity-hardening
    paths:
      - "rhs/compatibility/PATCH_MANIFEST.json"
      - "tools/rhs-binary-patcher/**"
      - ".github/workflows/rhs-class-activity-hardening-build.yml"

permissions:
  contents: write

concurrency:
  group: rhs-class-activity-hardening-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: rebuild/rhs-class-activity-hardening

      - name: Verify immutable baseline
        run: python3 scripts/verify-rhs-baseline.py

      - name: Build binary-native patcher
        run: cargo build --manifest-path tools/rhs-binary-patcher/Cargo.toml --release

      - name: Rebuild candidate from immutable baseline
        shell: bash
        run: |
          set -euo pipefail
          tools/rhs-binary-patcher/target/release/rhs-binary-patcher patch \
            "rhs/baseline/ROBLOX High School.rbxl" \
            rhs/compatibility/PATCH_MANIFEST.json \
            "rhs/working/ROBLOX High School.rbxl" \
            /tmp/rhs-patch-receipt.json

      - name: Record candidate identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          root = Path(".")
          working = root / "rhs/working/ROBLOX High School.rbxl"
          manifest_path = root / "rhs/compatibility/PATCH_MANIFEST.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          patch_receipt = json.loads(Path("/tmp/rhs-patch-receipt.json").read_text(encoding="utf-8"))

          working_sha = hashlib.sha256(working.read_bytes()).hexdigest()
          manifest_sha = hashlib.sha256(manifest_path.read_bytes()).hexdigest()

          state = {
              "schemaVersion": 1,
              "stage": "compatibility_repair",
              "baselineSha256": manifest["baselineSha256"],
              "expectedWorkingSha256": working_sha,
              "modifiedFromBaseline": True,
              "runtimeVerified": False,
              "published": False,
              "compatibilityRepairs": [p["id"] for p in manifest["patches"]],
          }
          (root / "rhs/working/BUILD_STATE.json").write_text(
              json.dumps(state, indent=2) + "\n", encoding="utf-8"
          )

          receipt = {
              "schemaVersion": 1,
              "baselineSha256": manifest["baselineSha256"],
              "workingSha256": working_sha,
              "patchManifestSha256": manifest_sha,
              "binaryPatcher": {
                  "engine": "rbx_binary",
                  "rbxDomRevision": "43d1f129f2eb1fd055512f039863ff35ae5a10f1"
              },
              "patchReceipt": patch_receipt,
          }
          (root / "rhs/working/BUILD_RECEIPT.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print("WORKING_SHA256", working_sha)
          PY

      - name: Parse and prove semantic parity
        shell: bash
        run: |
          set -euo pipefail
          tools/rhs-binary-patcher/target/release/rhs-binary-patcher check \
            "rhs/working/ROBLOX High School.rbxl"
          tools/rhs-binary-patcher/target/release/rhs-binary-patcher parity \
            "rhs/baseline/ROBLOX High School.rbxl" \
            "rhs/working/ROBLOX High School.rbxl" \
            /tmp/rhs-patch-receipt.json

      - name: Commit rebuilt candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "RHS Hardening Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add "rhs/working/ROBLOX High School.rbxl" rhs/working/BUILD_STATE.json rhs/working/BUILD_RECEIPT.json
          if git diff --cached --quiet; then
            echo "No candidate changes."
            exit 0
          fi
          git commit -m "Rebuild RHS candidate with class activity hardening"
          git push origin HEAD:rebuild/rhs-class-activity-hardening
