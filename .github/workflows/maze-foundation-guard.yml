name: Maze World Foundation Guard

on:
  push:
    branches:
      - rebuild/maze-world-foundation
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  pristine-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert Maze World foundation files are unchanged
        shell: bash
        run: |
          BASE=7ebfd2f81ddfc3d740eee1641b859f49dc087323
          git diff --exit-code "$BASE" --             game/maze-world.rbxl             game/Place.rbxmx             game/PlaceTerrain.rbxmx             game/src/common/Maze.lua             game/src/common/MazeGenerator.lua             game/src/common/TouchItem.lua             game/src/common/TagItem.lua             game/src/common/thunks/startGame.lua             game/src/common/thunks/startRoomGameLoop.lua             game/src/common/thunks/playerFinishedRoom.lua             game/src/client/Components/Room.lua             game/src/client/Components/FinishScreen.lua

      - name: Assert Pips foundation remains shadow-only
        shell: bash
        run: |
          grep -q "mode = 'shadow'" game/src/common/PipsOverlayConfig.lua
          grep -q "blockFinish = false" game/src/common/PipsOverlayConfig.lua
          grep -q "replaceMazeUI = false" game/src/common/PipsOverlayConfig.lua
          grep -q "replaceMazeRewards = false" game/src/common/PipsOverlayConfig.lua
          grep -q "replaceMazeGeneration = false" game/src/common/PipsOverlayConfig.lua
