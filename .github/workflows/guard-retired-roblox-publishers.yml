name: Verify Retired Roblox Publishers

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/verify_legacy_roblox_publishers.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/verify_legacy_roblox_publishers.py'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/verify_legacy_roblox_publishers.py
