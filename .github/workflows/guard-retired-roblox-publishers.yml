name: Verify Retired Roblox Publishers

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/verify_legacy_roblox_publishers.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/verify_legacy_roblox_publishers.py'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/verify_legacy_roblox_publishers.py

  disable_retired_curriculum_workflows:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify only retired workflow files are absent
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'P00NSMASHER/PipsQuestWorld'
          test ! -e .github/workflows/emma-curriculum-refresh.yml
          test ! -e .github/workflows/emma-curriculum-infra-ci.yml
      - name: Disable the two exact retired GitHub Actions registrations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="repos/$GITHUB_REPOSITORY/actions/workflows"
          test "$(gh api "$base/377994065" --jq .path)" = '.github/workflows/emma-curriculum-refresh.yml'
          test "$(gh api "$base/378018343" --jq .path)" = '.github/workflows/emma-curriculum-infra-ci.yml'
          gh api --method PUT "$base/377994065/disable"
          gh api --method PUT "$base/378018343/disable"
          for id in 377994065 378018343; do
            state="$(gh api "$base/$id" --jq .state)"
            test "$state" = disabled_manually
            echo "RETIRED_WORKFLOW_DISABLED: $id"
          done
