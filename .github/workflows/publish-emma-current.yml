name: Publish Current Emma Classroom Showroom

# Release refresh: enclosed closet, refined teacher, clear wall frieze, and uniform hallway.

on:
  push:
    branches:
      - release/emma-classroom-61e9b56
    paths:
      - '.github/workflows/publish-emma-current.yml'

permissions:
  contents: read

concurrency:
  group: publish-emma-classroom
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      UNIVERSE_ID: '10769455759'
      PLACE_ID: '114603280760042'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pinned Luau and Rojo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tools/luau" "$RUNNER_TEMP/tools/rojo"
          cd "$RUNNER_TEMP/tools"
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 120 https://github.com/luau-lang/luau/releases/download/0.741/luau-ubuntu.zip -o luau.zip
          echo '134dc762ad26232af83e43f98dec03ff6030dd3a4452f9408b9d50ccea025503  luau.zip' | sha256sum -c -
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 120 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  rojo.zip' | sha256sum -c -
          unzip -q luau.zip -d luau
          unzip -q rojo.zip -d rojo
          chmod +x luau/luau luau/luau-compile rojo/rojo

      - name: Verify current showroom source
        shell: bash
        run: |
          set -euo pipefail
          for file in school/emma-classroom/showroom/*.lua school/emma-classroom/server/StaffModel.lua school/emma-classroom/shared/Data.lua; do
            "$RUNNER_TEMP/tools/luau/luau-compile" "$file" >/dev/null
          done
          python3 school/emma-classroom/showroom/verify_build.py
          python3 school/emma-classroom/showroom/audit_hallway_mobile_complexity.py --luau "$RUNNER_TEMP/tools/luau/luau"
          python3 school/emma-classroom/showroom/audit_photo_landmarks.py --luau "$RUNNER_TEMP/tools/luau/luau"
          python3 school/emma-classroom/showroom/audit_hallway_photo.py --luau "$RUNNER_TEMP/tools/luau/luau"
          python3 school/emma-classroom/showroom/audit_glazed_door_aperture.py --luau "$RUNNER_TEMP/tools/luau/luau"
          python3 school/emma-classroom/showroom/audit_purple_corner_chair.py --luau "$RUNNER_TEMP/tools/luau/luau"
          python3 school/emma-classroom/showroom/audit_flat_rug_source.py --luau "$RUNNER_TEMP/tools/luau/luau"
          python3 school/emma-classroom/tests/geometry_behavior.py --luau "$RUNNER_TEMP/tools/luau/luau"
          python3 school/emma-classroom/showroom/walkability_audit.py --self-test
          grep -q 'Enabled = false' school/emma-classroom/showroom/FurnitureMeshConfig.lua
          ! grep -q 'buildFoldingMat(' school/emma-classroom/showroom/Room.lua
          grep -q 'ShowroomStationaryTeacher' school/emma-classroom/showroom/Main.server.lua
          grep -q 'CFrame.new(-11,3.15,-29)' school/emma-classroom/showroom/Main.server.lua

      - name: Build exact classroom showroom
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/tools/rojo/rojo" build school/emma-showroom.project.json -o "$RUNNER_TEMP/emma-showroom.rbxl"
          test -s "$RUNNER_TEMP/emma-showroom.rbxl"
          sha256sum "$RUNNER_TEMP/emma-showroom.rbxl" | tee "$RUNNER_TEMP/place.sha256"

      - name: Publish exact classroom showroom
        id: publish
        shell: bash
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$ROBLOX_API_KEY"
          response="$RUNNER_TEMP/publish-response.json"
          code="$(curl --silent --show-error --location --output "$response" --write-out '%{http_code}' --request POST "https://apis.roblox.com/universes/v1/$UNIVERSE_ID/places/$PLACE_ID/versions?versionType=Published" --header "x-api-key: $ROBLOX_API_KEY" --header 'Content-Type: application/octet-stream' --data-binary @"$RUNNER_TEMP/emma-showroom.rbxl")"
          cat "$response"
          test "$code" -ge 200 -a "$code" -lt 300
          version="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["versionNumber"])' "$response")"
          echo "Roblox place version: $version" | tee "$RUNNER_TEMP/version.txt"

      - name: Save publication receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: emma-classroom-publish-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/place.sha256
            ${{ runner.temp }}/version.txt
            ${{ runner.temp }}/publish-response.json
          retention-days: 14
          if-no-files-found: warn
