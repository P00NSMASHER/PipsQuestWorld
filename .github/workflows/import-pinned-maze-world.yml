name: Import Pinned Maze World

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/import-pinned-maze-world.yml"

permissions:
  contents: write

concurrency:
  group: import-pinned-maze-world
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      UPSTREAM_URL: "https://github.com/MayGo/maze-world.git"
      PINNED_COMMIT: "2dba386aaa66c3351087ae5848bc5f6bf7a832b8"

    steps:
      - name: Checkout Pip's Quest World
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone exact Maze World source with submodules
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/maze-world
          git clone --recursive "$UPSTREAM_URL" /tmp/maze-world
          cd /tmp/maze-world
          git checkout --detach "$PINNED_COMMIT"
          git submodule sync --recursive
          git submodule update --init --recursive

          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$PINNED_COMMIT"
          echo "PINNED_UPSTREAM_OK $ACTUAL"

      - name: Copy complete working tree into game
        shell: bash
        run: |
          set -euo pipefail
          rm -rf game
          mkdir -p game
          rsync -a --delete --exclude='.git' --exclude='Game.rbxlx' /tmp/maze-world/ game/
          mkdir -p game/UPSTREAM_LFS_POINTERS
          git -C /tmp/maze-world show HEAD:Game.rbxlx > game/UPSTREAM_LFS_POINTERS/Game.rbxlx.pointer

          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const root = 'game';
          const hardLimit = 100 * 1024 * 1024;
          const files = [];

          function walk(dir) {
            for (const entry of fs.readdirSync(dir, {withFileTypes:true})) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.isFile()) files.push({path:full,size:fs.statSync(full).size});
            }
          }

          walk(root);
          files.sort((a,b)=>b.size-a.size);

          const tooLarge = files.filter(x=>x.size >= hardLimit);
          if (tooLarge.length) {
            console.error('Files exceed GitHub 100 MiB hard limit:', tooLarge);
            process.exit(2);
          }

          console.log('IMPORTED_FILES', files.length);
          console.log('LARGEST_FILES');
          for (const f of files.slice(0,20)) console.log(f.size, f.path);

          const receipt = {
            schemaVersion: 1,
            upstream: 'MayGo/maze-world',
            upstreamUrl: process.env.UPSTREAM_URL,
            pinnedCommit: process.env.PINNED_COMMIT,
            recursiveSubmodules: true,
            importedBy: 'GitHub Actions',
            importedFileCount: files.length,
            omittedArtifacts: ['Game.rbxlx (upstream Git LFS build artifact; expanded size exceeds GitHub normal-file limit)']
          };
          fs.writeFileSync(path.join(root,'UPSTREAM_SOURCE.json'), JSON.stringify(receipt,null,2)+'\n');
          NODE

      - name: Verify required Maze World files exist
        shell: bash
        run: |
          set -euo pipefail
          test -f game/LICENSE
          test -f game/README.md
          test -f game/default.project.json
          test -f game/maze-world.rbxl
          test -f game/Place.rbxmx
          test -d game/src
          test -d game/modules
          echo "MAZE_WORLD_TREE_COMPLETE"

      - name: Commit pristine imported baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PipsQuestWorld Import Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A game

          if git diff --cached --quiet; then
            echo "No import changes to commit."
            exit 0
          fi

          git commit -m "Import pristine Maze World baseline at 2dba386"
          git push origin HEAD:main
