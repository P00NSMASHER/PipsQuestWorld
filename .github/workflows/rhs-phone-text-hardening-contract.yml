name: RHS Phone Text Hardening Contract

on:
  push:
    branches:
      - hardening/rhs-phone-text-trust-v4
    paths:
      - "scripts/rhs-phone-text-hardening-contract.py"
      - ".github/workflows/rhs-phone-text-hardening-contract.yml"
      - "rhs/compatibility/PATCH_MANIFEST.json"
      - "rhs/working/ROBLOX High School.rbxl"
      - "rhs/working/BUILD_STATE.json"
  pull_request:
    paths:
      - "scripts/rhs-phone-text-hardening-contract.py"
      - ".github/workflows/rhs-phone-text-hardening-contract.yml"
      - "rhs/compatibility/PATCH_MANIFEST.json"
      - "rhs/working/ROBLOX High School.rbxl"
      - "rhs/working/BUILD_STATE.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable baseline
        run: python3 scripts/verify-rhs-baseline.py
      - name: Build pinned Roblox converter
        shell: bash
        run: |
          set -euo pipefail
          cargo install --git https://github.com/rojo-rbx/rbx-dom.git \
            --rev 43d1f129f2eb1fd055512f039863ff35ae5a10f1 \
            --locked rbx_util
      - name: Convert working candidate
        run: rbx-util convert "rhs/working/ROBLOX High School.rbxl" /tmp/rhs-working.rbxlx
      - name: Verify phone/text server trust contract
        run: |
          python3 scripts/rhs-phone-text-hardening-contract.py \
            --xml /tmp/rhs-working.rbxlx \
            --manifest rhs/compatibility/PATCH_MANIFEST.json \
            --build-state rhs/working/BUILD_STATE.json \
            --output /tmp/rhs-phone-text-hardening.json
      - name: Upload contract report
        uses: actions/upload-artifact@v4
        with:
          name: rhs-phone-text-hardening
          path: /tmp/rhs-phone-text-hardening.json
          if-no-files-found: error
          retention-days: 30
