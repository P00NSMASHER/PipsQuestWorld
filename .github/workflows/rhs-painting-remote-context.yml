name: RHS Painting Remote Context

on:
  push:
    branches:
      - hardening/rhs-painting-remote-trust-v3
    paths:
      - ".github/workflows/rhs-painting-remote-context.yml"

permissions:
  contents: read

jobs:
  context:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify immutable baseline
        run: python3 scripts/verify-rhs-baseline.py

      - name: Build pinned Roblox converter
        shell: bash
        run: |
          set -euo pipefail
          cargo install --git https://github.com/rojo-rbx/rbx-dom.git \
            --rev 43d1f129f2eb1fd055512f039863ff35ae5a10f1 \
            --locked rbx_util

      - name: Convert working build
        run: rbx-util convert "rhs/working/ROBLOX High School.rbxl" /tmp/rhs-working.rbxlx

      - name: Print painting server and caller context
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import xml.etree.ElementTree as ET

          root=ET.parse("/tmp/rhs-working.rbxlx").getroot()
          script_classes={"Script","LocalScript","ModuleScript"}

          def prop_text(item,name):
              props=item.find("Properties")
              if props is None:
                  return ""
              for p in props:
                  if p.attrib.get("name")!=name:
                      continue
                  if p.tag=="Content":
                      child=next(iter(p),None)
                      return (child.text or "") if child is not None else ""
                  return p.text or ""
              return ""

          def item_name(item):
              return prop_text(item,"Name") or "(unnamed)"

          def walk(parent,prefix=""):
              for item in parent.findall("Item"):
                  nm=item_name(item).replace("/","_")
                  path=f"{prefix}/{nm}" if prefix else nm
                  yield item,path
                  yield from walk(item,path)

          target="ServerScriptService/ServerPaintingManager"
          remote_names={"PlacePaintRequest","EraseAllPaint","GetPaintbrush"}
          found=False

          for item,path in walk(root):
              if path==target:
                  source=prop_text(item,"Source")
                  found=True
                  print("=== PAINTING_SERVER_SCRIPT ===")
                  print("SOURCE_SHA256",hashlib.sha256(source.encode()).hexdigest())
                  lines=source.splitlines()
                  for i,line in enumerate(lines,1):
                      print(f"{i:04d}: {line}")
                  print("=== END_PAINTING_SERVER_SCRIPT ===")
                  break

          if not found:
              raise SystemExit("missing ServerPaintingManager")

          print("=== PAINTING_REMOTE_REFS ===")
          for item,path in walk(root):
              cls=item.attrib.get("class","")
              if cls not in script_classes or path==target:
                  continue
              source=prop_text(item,"Source")
              if not source:
                  continue
              lines=source.splitlines()
              hits=[i for i,line in enumerate(lines,1) if any(("RemoteFunctions."+name) in line for name in remote_names)]
              if not hits:
                  continue
              print("REF_SCRIPT",cls,path)
              shown=set()
              for center in hits:
                  for n in range(max(1,center-18),min(len(lines),center+26)+1):
                      if n in shown:
                          continue
                      shown.add(n)
                      print(f"{n:04d}: {lines[n-1]}")
                  print("---")
          print("=== END_PAINTING_REMOTE_REFS ===")

          print("=== PAINTING_INSTANCE_PATHS ===")
          count=0
          for item,path in walk(root):
              nm=item_name(item).lower()
              if "paint" in nm or "canvas" in nm:
                  print("INSTANCE",item.attrib.get("class",""),path)
                  count+=1
                  if count>=500:
                      break
          print("INSTANCE_COUNT_PRINTED",count)
          print("=== END_PAINTING_INSTANCE_PATHS ===")
          PY
