name: RHS Runtime Side-Effect Audit

on:
  pull_request:
    paths:
      - "scripts/rhs-runtime-side-effect-audit.py"
      - ".github/workflows/rhs-runtime-side-effect-audit.yml"
      - "rhs/working/ROBLOX High School.rbxl"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify pinned working build
        run: python3 scripts/verify-rhs-baseline.py

      - name: Build pinned Roblox converter
        shell: bash
        run: |
          set -euo pipefail
          cargo install --git https://github.com/rojo-rbx/rbx-dom.git \
            --rev 43d1f129f2eb1fd055512f039863ff35ae5a10f1 \
            --locked rbx_util

      - name: Convert working build
        run: rbx-util convert "rhs/working/ROBLOX High School.rbxl" /tmp/rhs-working.rbxlx

      - name: Audit runtime side effects
        run: |
          python3 scripts/rhs-runtime-side-effect-audit.py \
            --xml /tmp/rhs-working.rbxlx \
            --output /tmp/rhs-runtime-side-effects.json

      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: rhs-runtime-side-effects
          path: /tmp/rhs-runtime-side-effects.json
          if-no-files-found: error
          retention-days: 30
