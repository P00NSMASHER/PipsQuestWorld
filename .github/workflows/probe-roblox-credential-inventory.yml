name: Probe Roblox Credential Inventory

on:
  push:
    branches:
      - rebuild/school-neighborhood-faculty-v1
    paths:
      - '.github/workflows/probe-roblox-credential-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
      ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
      ROBLOX_ASSET_API_KEY: ${{ secrets.ROBLOX_ASSET_API_KEY }}
      ROBLOX_CLOUD_API_KEY: ${{ secrets.ROBLOX_CLOUD_API_KEY }}
      RBX_API_KEY: ${{ secrets.RBX_API_KEY }}
      ROBLOSECURITY: ${{ secrets.ROBLOSECURITY }}
      ROBLOX_COOKIE: ${{ secrets.ROBLOX_COOKIE }}
      ROBLOX_SECURITY_COOKIE: ${{ secrets.ROBLOX_SECURITY_COOKIE }}
      ROBLOX_SECURITY: ${{ secrets.ROBLOX_SECURITY }}
      ROBLOX_OAUTH_CLIENT_ID: ${{ secrets.ROBLOX_OAUTH_CLIENT_ID }}
      ROBLOX_OAUTH_CLIENT_SECRET: ${{ secrets.ROBLOX_OAUTH_CLIENT_SECRET }}
    steps:
      - name: Report populated credential slots only
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for name in \
            ROBLOX_API_KEY ROBLOX_OPEN_CLOUD_API_KEY ROBLOX_ASSET_API_KEY ROBLOX_CLOUD_API_KEY RBX_API_KEY \
            ROBLOSECURITY ROBLOX_COOKIE ROBLOX_SECURITY_COOKIE ROBLOX_SECURITY \
            ROBLOX_OAUTH_CLIENT_ID ROBLOX_OAUTH_CLIENT_SECRET; do
            if [ -n "${!name:-}" ]; then
              echo "CREDENTIAL_SLOT_PRESENT=$name"
              found=$((found+1))
            fi
          done
          echo "CREDENTIAL_SLOT_COUNT=$found"
          test "$found" -gt 0
