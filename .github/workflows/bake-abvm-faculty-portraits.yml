name: Bake ABVM Faculty Portraits

on:
  push:
    branches:
      - rebuild/school-neighborhood-faculty-v1
    paths:
      - 'school/neighborhood/faculty-portrait-sources.tsv'
      - 'school/neighborhood/tools/bake_faculty_portraits.py'
      - '.github/workflows/bake-abvm-faculty-portraits.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bake-abvm-faculty-portraits
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/school-neighborhood-faculty-v1
          fetch-depth: 0

      - name: Install deterministic image tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          convert -version

      - name: Bake all 18 approved portraits into Luau
        shell: bash
        run: |
          set -euo pipefail
          python3 school/neighborhood/tools/bake_faculty_portraits.py             --manifest school/neighborhood/faculty-portrait-sources.tsv             --out school/neighborhood/shared/PortraitPixels.lua             --workdir "$RUNNER_TEMP/abvm-faculty-portraits"
          grep -q '__meta={generated=true,width=48,height=48,segment=16,count=18}'             school/neighborhood/shared/PortraitPixels.lua
          test "$(grep -c '        rows={' school/neighborhood/shared/PortraitPixels.lua)" -eq 18
          wc -c school/neighborhood/shared/PortraitPixels.lua

      - name: Commit generated portrait payload if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- school/neighborhood/shared/PortraitPixels.lua; then
            echo "Baked portrait payload is already current."
            exit 0
          fi
          git config user.name "ABVM Portrait Baker"
          git config user.email "actions@users.noreply.github.com"
          git add school/neighborhood/shared/PortraitPixels.lua
          git commit -m "Bake 18 faculty portraits into Roblox place data"
          git push origin HEAD:rebuild/school-neighborhood-faculty-v1

      - name: Preserve generated payload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abvm-baked-faculty-portraits-${{ github.run_id }}
          path: school/neighborhood/shared/PortraitPixels.lua
          retention-days: 14
          if-no-files-found: error
