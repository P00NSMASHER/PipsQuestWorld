name: Publish Pip High to Roblox
# one-shot trigger for exact canonical 33a5a11

on:
  push:
    branches:
      - deploy/roblox-open-cloud-33a5a11
    paths:
      - '.github/workflows/publish-roblox.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roblox-publish-pip-high
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: 33a5a11ba771e0bbfbc82ed40ce5417c772a2f17
      UNIVERSE_ID: '10768955678'
      PLACE_ID: '87245440673982'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 33a5a11ba771e0bbfbc82ed40ce5417c772a2f17
          persist-credentials: false

      - name: Require configured Roblox API key
        shell: bash
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$ROBLOX_API_KEY" || { echo "::error::ROBLOX_API_KEY repository secret is missing"; exit 1; }

      - name: Install pinned Rojo
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 120 \
            https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o "$RUNNER_TEMP/rojo.zip"
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  '"$RUNNER_TEMP/rojo.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/rojo.zip" -d "$RUNNER_TEMP/rojo"
          chmod +x "$RUNNER_TEMP/rojo/rojo"

      - name: Build exact canonical place
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          "$RUNNER_TEMP/rojo/rojo" build school/default.project.json -o "$RUNNER_TEMP/PipHigh.rbxlx"
          test -s "$RUNNER_TEMP/PipHigh.rbxlx"
          sha256sum "$RUNNER_TEMP/PipHigh.rbxlx"

      - name: Publish exact canonical to existing Roblox place
        shell: bash
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/roblox-publish-response.json"
          status="$(curl --silent --show-error --location \
            --output "$response" --write-out '%{http_code}' \
            --request POST \
            "https://apis.roblox.com/universes/v1/$UNIVERSE_ID/places/$PLACE_ID/versions?versionType=Published" \
            --header "x-api-key: $ROBLOX_API_KEY" \
            --header 'Content-Type: application/xml' \
            --data-binary "@$RUNNER_TEMP/PipHigh.rbxlx")"
          cat "$response"
          test "$status" -ge 200 -a "$status" -lt 300 || { echo "::error::Roblox publish failed with HTTP $status"; exit 1; }
          python3 - "$response" <<'PY'
          import json, pathlib, sys
          data=json.loads(pathlib.Path(sys.argv[1]).read_text())
          version=data.get("versionNumber")
          if not isinstance(version, int) or version < 1:
              raise SystemExit("Roblox response did not contain a valid versionNumber")
          print(f"ROBLOX_PUBLISH_OK versionNumber={version}")
          PY
