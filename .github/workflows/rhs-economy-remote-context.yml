name: RHS Economy Remote Context

on:
  push:
    branches:
      - hardening/rhs-economy-trust-v3
    paths:
      - ".github/workflows/rhs-economy-remote-context.yml"

permissions:
  contents: read

jobs:
  context:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify immutable baseline
        run: python3 scripts/verify-rhs-baseline.py

      - name: Build pinned Roblox converter
        shell: bash
        run: |
          set -euo pipefail
          cargo install --git https://github.com/rojo-rbx/rbx-dom.git \
            --rev 43d1f129f2eb1fd055512f039863ff35ae5a10f1 \
            --locked rbx_util

      - name: Convert working build
        run: rbx-util convert "rhs/working/ROBLOX High School.rbxl" /tmp/rhs-working.rbxlx

      - name: Print economy remote contexts
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import re
          import xml.etree.ElementTree as ET

          root=ET.parse("/tmp/rhs-working.rbxlx").getroot()
          script_classes={"Script","LocalScript","ModuleScript"}
          targets={
              "ServerScriptService/Cash+ItemAwarder_NEW",
              "ServerScriptService/ItemBuyScript",
              "ServerScriptService/LarryDonationsHandler",
              "ServerScriptService/GamePassCheckScript",
          }

          def prop_text(item,name):
              props=item.find("Properties")
              if props is None:
                  return ""
              for p in props:
                  if p.attrib.get("name")!=name:
                      continue
                  if p.tag=="Content":
                      child=next(iter(p),None)
                      return (child.text or "") if child is not None else ""
                  return p.text or ""
              return ""

          def item_name(item):
              return prop_text(item,"Name") or "(unnamed)"

          def walk(parent,prefix=""):
              for item in parent.findall("Item"):
                  nm=item_name(item).replace("/","_")
                  path=f"{prefix}/{nm}" if prefix else nm
                  yield item,path
                  yield from walk(item,path)

          target_sources={}
          remote_names=set()

          for item,path in walk(root):
              cls=item.attrib.get("class","")
              if cls not in script_classes:
                  continue
              source=prop_text(item,"Source")
              if not source:
                  continue
              if path in targets:
                  target_sources[path]=(cls,source)
                  for m in re.finditer(r"RemoteFunctions\.([A-Za-z0-9_ ]+)\.(?:OnServerEvent|OnServerInvoke)",source):
                      remote_names.add(m.group(1))

          missing=sorted(targets-set(target_sources))
          if missing:
              raise SystemExit("missing target scripts: "+", ".join(missing))

          print("=== ECONOMY_TARGET_INDEX ===")
          for path,(cls,source) in sorted(target_sources.items()):
              print("TARGET",cls,path,"sha256="+hashlib.sha256(source.encode()).hexdigest(),"lines="+str(len(source.splitlines())))
          print("REMOTE_NAMES",",".join(sorted(remote_names)))
          print("=== END_ECONOMY_TARGET_INDEX ===")

          for path,(cls,source) in sorted(target_sources.items()):
              lines=source.splitlines()
              starts=[]
              rx=re.compile(r"RemoteFunctions\.([A-Za-z0-9_ ]+)\.(OnServerEvent|OnServerInvoke)")
              for i,line in enumerate(lines,1):
                  m=rx.search(line)
                  if m:
                      starts.append((i,m.group(1),m.group(2)))
              print(f"=== ECONOMY_SCRIPT {cls} {path} ===")
              for idx,(line,name,kind) in enumerate(starts):
                  end=(starts[idx+1][0]-1) if idx+1<len(starts) else min(len(lines),line+140)
                  start=max(1,line-28)
                  print(f"--- HANDLER {kind} {name} line={line} ---")
                  for n in range(start,min(len(lines),max(end,line+120))+1):
                      print(f"{n:04d}: {lines[n-1]}")
              print("=== END_ECONOMY_SCRIPT ===")

          print("=== SHOP_ACCESS_CONTEXT ===")
          shop_gui_path="StarterGui/LoadableGuis/ShopGui/LoadScript"
          for item,path in walk(root):
              if path==shop_gui_path:
                  source=prop_text(item,"Source")
                  for n,line in enumerate(source.splitlines(),1):
                      if n<=120:
                          print(f"SHOP_GUI {n:04d}: {line}")
                  break

          shop_names=[]
          for item,path in walk(root):
              if path=="ReplicatedStorage/Shops":
                  for child in item.findall("Item"):
                      shop_names.append(item_name(child))
                  break
          print("SHOP_NAMES",",".join(sorted(shop_names)))

          for item,path in walk(root):
              cls=item.attrib.get("class","")
              if cls not in script_classes:
                  continue
              source=prop_text(item,"Source")
              if not source:
                  continue
              if "ShopGui" in source and ("OpenGui" in source or "SelectedShop" in source or ".Shop" in source or "shop" in source.lower()):
                  hits=[]
                  for i,line in enumerate(source.splitlines(),1):
                      if "ShopGui" in line or "SelectedShop" in line or "OpenGui" in line:
                          hits.append(i)
                  if hits:
                      print("SHOP_REF_SCRIPT",cls,path)
                      src_lines=source.splitlines()
                      shown=set()
                      for center in hits[:20]:
                          for n in range(max(1,center-12),min(len(src_lines),center+18)+1):
                              if n in shown:
                                  continue
                              shown.add(n)
                              print(f"{n:04d}: {src_lines[n-1]}")
                          print("---")
          print("=== END_SHOP_ACCESS_CONTEXT ===")

          print("=== SHOPKEEPER_INSTANCE_CONTEXT ===")
          shopkeepers={"Rude Lunch Lady","Chill Lunch Lady","Noob Lunch Lady","Dexter","Umbra","Wendy","Alyssa"}
          for item,path in walk(root):
              if item_name(item) not in shopkeepers:
                  continue
              print("SHOPKEEPER",item.attrib.get("class",""),path)
              children=[]
              for child in item.findall("Item"):
                  children.append((child.attrib.get("class",""),item_name(child)))
              for cls,nm in children[:80]:
                  print("CHILD",cls,nm)
          print("=== END_SHOPKEEPER_INSTANCE_CONTEXT ===")

          print("=== ECONOMY_REMOTE_REFS ===")
          for item,path in walk(root):
              cls=item.attrib.get("class","")
              if cls not in script_classes or path in targets:
                  continue
              source=prop_text(item,"Source")
              if not source:
                  continue
              lines=source.splitlines()
              hits=[]
              for i,line in enumerate(lines,1):
                  if any(("RemoteFunctions."+name) in line for name in remote_names):
                      hits.append(i)
              if not hits:
                  continue
              print("REF_SCRIPT",cls,path)
              shown=set()
              for center in hits:
                  for n in range(max(1,center-14),min(len(lines),center+24)+1):
                      if n in shown:
                          continue
                      shown.add(n)
                      print(f"{n:04d}: {lines[n-1]}")
                  print("---")
          print("=== END_ECONOMY_REMOTE_REFS ===")
          PY
