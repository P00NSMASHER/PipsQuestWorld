name: RHS Economy Remote Context

on:
  push:
    branches:
      - audit/rhs-economy-remote-trust-v4
    paths:
      - ".github/workflows/rhs-economy-remote-context.yml"

permissions:
  contents: read

jobs:
  context:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable baseline
        run: python3 scripts/verify-rhs-baseline.py
      - name: Build pinned Roblox converter
        shell: bash
        run: |
          set -euo pipefail
          cargo install --git https://github.com/rojo-rbx/rbx-dom.git \
            --rev 43d1f129f2eb1fd055512f039863ff35ae5a10f1 \
            --locked rbx_util
      - name: Convert working build
        run: rbx-util convert "rhs/working/ROBLOX High School.rbxl" /tmp/rhs-working.rbxlx
      - name: Print economy remote contexts
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import re
          import xml.etree.ElementTree as ET

          root=ET.parse("/tmp/rhs-working.rbxlx").getroot()
          script_classes={"Script","LocalScript","ModuleScript"}
          full_targets={
              "ServerScriptService/Cash+ItemAwarder_NEW",
              "ServerScriptService/LarryDonationsHandler",
          }
          item_target="ServerScriptService/ItemBuyScript"
          remote_names={
              "PurchasePermanentItem","PurchaseTemporaryItem","PurchaseLoyaltyItem",
              "PurchaseHouse","PurchasePaintingLicense","ClaimSpecialGuitar",
              "RedeemTwitterCode","ObjectBuyRequest","DonateToLarry"
          }

          def prop_text(item,name):
              props=item.find("Properties")
              if props is None:return ""
              for p in props:
                  if p.attrib.get("name")!=name:continue
                  if p.tag=="Content":
                      child=next(iter(p),None)
                      return (child.text or "") if child is not None else ""
                  return p.text or ""
              return ""
          def item_name(item):return prop_text(item,"Name") or "(unnamed)"
          def walk(parent,prefix=""):
              for item in parent.findall("Item"):
                  nm=item_name(item).replace("/","_")
                  path=f"{prefix}/{nm}" if prefix else nm
                  yield item,path
                  yield from walk(item,path)

          for item,path in walk(root):
              if path == item_target:
                  source=prop_text(item,"Source")
                  print("=== ITEM_BUY_FULL_SCRIPT ===")
                  print("SOURCE_SHA256",hashlib.sha256(source.encode()).hexdigest())
                  for i,line in enumerate(source.splitlines(),1):
                      print(f"{i:04d}: {line}")
                  print("=== END_ITEM_BUY_FULL_SCRIPT ===")

              if path in full_targets:
                  source=prop_text(item,"Source")
                  print(f"=== ECONOMY_FULL_SCRIPT {path} ===")
                  print("SOURCE_SHA256",hashlib.sha256(source.encode()).hexdigest())
                  for i,line in enumerate(source.splitlines(),1):
                      print(f"{i:04d}: {line}")
                  print("=== END_ECONOMY_FULL_SCRIPT ===")

              if path==item_target:
                  source=prop_text(item,"Source")
                  lines=source.splitlines()
                  print("=== ITEM_BUY_HANDLER_CONTEXT ===")
                  print("SOURCE_SHA256",hashlib.sha256(source.encode()).hexdigest())
                  centers=[]
                  for i,line in enumerate(lines,1):
                      if ("OnServerInvoke" in line or "OnServerEvent" in line) and any(name in line for name in remote_names):
                          centers.append(i)
                  shown=set()
                  for center in centers:
                      print("HANDLER_CENTER",center,lines[center-1])
                      for n in range(max(1,center-50),min(len(lines),center+90)+1):
                          if n in shown:continue
                          shown.add(n)
                          print(f"{n:04d}: {lines[n-1]}")
                      print("---")
                  print("=== END_ITEM_BUY_HANDLER_CONTEXT ===")

          print("=== ECONOMY_REMOTE_REFS ===")
          for item,path in walk(root):
              cls=item.attrib.get("class","")
              if cls not in script_classes or path in full_targets or path==item_target:continue
              source=prop_text(item,"Source")
              if not source:continue
              lines=source.splitlines()
              hits=[i for i,line in enumerate(lines,1) if any(("RemoteFunctions."+name) in line for name in remote_names)]
              if not hits:continue
              print("REF_SCRIPT",cls,path)
              shown=set()
              for center in hits:
                  for n in range(max(1,center-15),min(len(lines),center+24)+1):
                      if n in shown:continue
                      shown.add(n)
                      print(f"{n:04d}: {lines[n-1]}")
                  print("---")
          print("=== END_ECONOMY_REMOTE_REFS ===")
          PY
