name: Emma Classroom Replica CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'school/emma-classroom/showroom/**'
      - 'school/emma-showroom.project.json'
      - 'school/emma-classroom/tests/furniture_adapter_runtime.py'
      - 'school/emma-classroom/RELEASE_RECEIPT.json'
      - 'school/emma-classroom/verify_release_receipt.py'
      - 'school/emma-classroom/qa/audit_native_carpet_video.py'
      - 'school/emma-classroom/qa/audit_native_carpet_sequence.py'
      - 'school/emma-classroom/showroom/ArtPass.lua'
      - '.github/workflows/emma-showroom-ci.yml'
      - '.github/workflows/publish-emma-classroom.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-photo-guided-replica:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          # pull_request default is the synthetic merge ref, not the PR head.
          # Check the same exact source revision being reviewed for release.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source revision
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SOURCE_SHA"
          echo "EXACT_SOURCE_CHECKOUT_PASS sha=$actual"
          printf 'Classroom source tested: %s\n' "$actual" >> "$GITHUB_STEP_SUMMARY"

      - name: Syntax-check optional private native video auditor without reading media
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile school/emma-classroom/qa/audit_native_carpet_video.py
          python3 -m py_compile school/emma-classroom/qa/audit_native_carpet_sequence.py
          echo "NATIVE_VIDEO_AUDIT_SYNTAX_PASS private_media_not_in_ci=true"

      - name: Reject synthetic video false positives without ever accessing private footage
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/native-rug-audit-venv"
          "$RUNNER_TEMP/native-rug-audit-venv/bin/python" -m pip install \
            --disable-pip-version-check --no-input --only-binary=:all: \
            "numpy==2.3.5" "opencv-python-headless==4.13.0.92" "Pillow==11.3.0"
          "$RUNNER_TEMP/native-rug-audit-venv/bin/python" \
            school/emma-classroom/qa/audit_native_carpet_video.py --self-test
          "$RUNNER_TEMP/native-rug-audit-venv/bin/python" \
            school/emma-classroom/qa/audit_native_carpet_sequence.py --self-test
          echo "NATIVE_VIDEO_SYNTHETIC_CI_PASS private_media_not_accessed=true"
          echo "NATIVE_VIDEO_SEQUENCE_CI_PASS three_frames_reconciled=true"
          # This exact-source synthetic pixel mutation test is fast, and
          # must fail immediately if ANY one of 16 rays, any cloud, or a
          # single book illustration can disappear without detection.
          # It checks only invented images; no classroom/private video.
          "$RUNNER_TEMP/native-rug-audit-venv/bin/python" \
            school/emma-classroom/showroom/audit_rendered_artwork.py --self-test
          echo "ARTWORK_ALL_16_RAYS_FAST_CI_PASS synthetic_only=true"

      - name: Audit last confirmed published Roblox preview without claiming candidate is live
        shell: bash
        run: |
          set -euo pipefail
          python3 school/emma-classroom/verify_release_receipt.py --self-test
          python3 school/emma-classroom/verify_release_receipt.py

      - name: Install pinned Luau and Rojo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tools/luau" "$RUNNER_TEMP/tools/rojo"
          cd "$RUNNER_TEMP/tools"
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 120 \
            https://github.com/luau-lang/luau/releases/download/0.741/luau-ubuntu.zip -o luau.zip
          echo '134dc762ad26232af83e43f98dec03ff6030dd3a4452f9408b9d50ccea025503  luau.zip' | sha256sum -c -
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 120 \
            https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  rojo.zip' | sha256sum -c -
          unzip -q luau.zip -d luau
          unzip -q rojo.zip -d rojo
          chmod +x luau/luau luau/luau-compile rojo/rojo

      - name: Compile ONLY shipped room/client scripts
        shell: bash
        run: |
          set -euo pipefail
          for file in school/emma-classroom/showroom/*.lua school/emma-classroom/showroom/ArtPass.lua; do
            "$RUNNER_TEMP/tools/luau/luau-compile" "$file" > /dev/null
          done
          python3 school/emma-classroom/showroom/verify_build.py

      - name: Fail fast on exact-source room geometry and mobile part budget
        shell: bash
        run: |
          set -euo pipefail
          # Evaluate the actual classroom Luau constructors before the costly
          # independent screenshot job. The exporter checks physical layout,
          # all 16 desk/chair pairs, object support, and the existing <=3100
          # part budget. Keep the same thresholds used by visual CI.
          python3 school/emma-classroom/showroom/export_source_scene.py \
            --luau "$RUNNER_TEMP/tools/luau/luau" \
            --out "$RUNNER_TEMP/emma-room-ci-source.rbxmx"
          test -s "$RUNNER_TEMP/emma-room-ci-source.rbxmx"

      - name: Inspect constructed carpet SurfaceGuis and reject known iPhone regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 school/emma-classroom/showroom/audit_rug_ui.py \
            --luau "$RUNNER_TEMP/tools/luau/luau"

      - name: Verify constructed daytime lighting and reject conflicting overrides
        shell: bash
        run: |
          set -euo pipefail
          python3 school/emma-classroom/showroom/audit_lighting.py \
            --luau "$RUNNER_TEMP/tools/luau/luau"

      - name: Validate storybook cover-facing in actual constructed Luau
        shell: bash
        run: |
          set -euo pipefail
          python3 school/emma-classroom/showroom/audit_storybook_facing.py \
            --luau "$RUNNER_TEMP/tools/luau/luau"

      - name: Reject non-uniform Roblox Ball carpet artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 school/emma-classroom/showroom/audit_native_rug_primitives.py \
            --luau "$RUNNER_TEMP/tools/luau/luau"

      - name: Reject native flattened-Ball foliage and collidable tree artwork
        shell: bash
        run: |
          set -euo pipefail
          python3 school/emma-classroom/showroom/audit_native_foliage_primitives.py \
            --luau "$RUNNER_TEMP/tools/luau/luau"

      - name: Reject native dot-like student chair ventilation parts
        shell: bash
        run: |
          set -euo pipefail
          python3 school/emma-classroom/showroom/audit_native_chair_vents.py \
            --luau "$RUNNER_TEMP/tools/luau/luau"

      - name: Verify Emma's single purple corner chair and child-safe placement
        shell: bash
        run: |
          set -euo pipefail
          python3 school/emma-classroom/showroom/audit_purple_corner_chair.py \
            --luau "$RUNNER_TEMP/tools/luau/luau"

      - name: Exercise furniture activation and transactional rollback in Luau
        shell: bash
        run: |
          set -euo pipefail
          python3 school/emma-classroom/tests/furniture_adapter_runtime.py \
            --luau "$RUNNER_TEMP/tools/luau/luau"

      - name: Verify spawn, aisles, reading corner, and hallways from actual Lua collision geometry
        shell: bash
        run: |
          set -euo pipefail
          python3 school/emma-classroom/showroom/walkability_audit.py --self-test
          python3 school/emma-classroom/showroom/walkability_audit.py \
            --luau "$RUNNER_TEMP/tools/luau/luau" \
            --out "$RUNNER_TEMP/emma-static-navigation.json"

      - name: Assemble showroom rather than the study game
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/tools/rojo/rojo" build school/emma-showroom.project.json -o "$RUNNER_TEMP/emma-replica.rbxl"
          "$RUNNER_TEMP/tools/rojo/rojo" build school/emma-showroom.project.json -o "$RUNNER_TEMP/emma-replica.rbxlx"
          test -s "$RUNNER_TEMP/emma-replica.rbxl"
          python3 school/emma-classroom/showroom/verify_build.py "$RUNNER_TEMP/emma-replica.rbxlx"
          sha256sum "$RUNNER_TEMP/emma-replica.rbxl"

      - name: Preserve exact-source preview candidate
        uses: actions/upload-artifact@v4
        with:
          name: emma-room-replica-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/emma-replica.rbxl
            ${{ runner.temp }}/emma-replica.rbxlx
            ${{ runner.temp }}/emma-static-navigation.json
          retention-days: 14
          if-no-files-found: error
