name: Emma Classroom Visual Snapshot

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'school/emma-showroom.project.json'
      - 'school/emma-classroom/showroom/**'
      - '.github/workflows/emma-showroom-visual-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot-constructed-luau-room:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Get exact review head
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned geometry executor
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 120 \
            https://github.com/luau-lang/luau/releases/download/0.741/luau-ubuntu.zip -o luau.zip
          echo '134dc762ad26232af83e43f98dec03ff6030dd3a4452f9408b9d50ccea025503  luau.zip' | sha256sum -c -
          mkdir -p luau
          unzip -q luau.zip -d luau
          chmod +x luau/luau

      - name: Evaluate actual classroom constructor into a STATIC scene
        shell: bash
        run: |
          set -euo pipefail
          python3 school/emma-classroom/showroom/export_source_scene.py \
            --luau "$RUNNER_TEMP/luau/luau" \
            --out "$RUNNER_TEMP/emma-classroom-source.rbxmx"
          test -s "$RUNNER_TEMP/emma-classroom-source.rbxmx"
          python3 school/emma-classroom/showroom/export_source_scene.py \
            --luau "$RUNNER_TEMP/luau/luau" \
            --out "$RUNNER_TEMP/emma-classroom-cutaway.rbxmx" --cutaway
          test -s "$RUNNER_TEMP/emma-classroom-cutaway.rbxmx"

      - name: Install sandboxed independent headless renderer
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/rhr-venv"
          "$RUNNER_TEMP/rhr-venv/bin/pip" install --disable-pip-version-check \
            --pre 'roblox-headless-renderer==1.0.0rc1'
          "$RUNNER_TEMP/rhr-venv/bin/rhr" --help | head -30

      - name: Render interior cutaway and exterior control screenshots
        shell: bash
        env:
          RHR_CACHE_DIR: ${{ runner.temp }}/rhr-cache
        run: |
          set -euo pipefail
          RHR="$RUNNER_TEMP/rhr-venv/bin/rhr"
          SRC="$RUNNER_TEMP/emma-classroom-cutaway.rbxmx"
          mkdir -p "$RUNNER_TEMP/visual"
          # Keep aerial renders independent. The six-view batch once returned
          # nearly all-white PNGs despite reporting success.
          "$RHR" scene "$SRC" --camera=65,50,65 --look-at=0,6,-4 --out "$RUNNER_TEMP/visual/01-isometric.png"
          "$RHR" scene "$SRC" --view front --out "$RUNNER_TEMP/visual/02-front.png"
          "$RHR" scene "$SRC" --view top --out "$RUNNER_TEMP/visual/03-top.png"
          # Ground-level positions measured in room source studs.
          # Use the FULL classroom here. Cutaway previews are only for aerial shots;
          # otherwise dark voids replace real walls at the player eye position.
          FULL="$RUNNER_TEMP/emma-classroom-source.rbxmx"
          "$RHR" scene "$FULL" --camera=0,5.5,18 --look-at=0,7,-33 --out "$RUNNER_TEMP/visual/05-eye-front.png"
          "$RHR" scene "$FULL" --camera=0,5.5,-17 --look-at=0,6,25 --out "$RUNNER_TEMP/visual/06-eye-back.png"
          "$RHR" scene "$FULL" --camera=12,5.5,0 --look-at=-36,7,0 --out "$RUNNER_TEMP/visual/07-eye-windows.png"
          "$RHR" scene "$FULL" --camera=-20,5.5,0 --look-at=35,7,0 --out "$RUNNER_TEMP/visual/08-eye-storage.png"
          # Furniture detail views: actual school-chair contour and child desk
          # from two angles, not simulated 2D design illustrations.
          "$RHR" scene "$FULL" --camera=4.5,4.3,12.6 --look-at=0,2.4,6.5 --out "$RUNNER_TEMP/visual/09-chair-back.png"
          "$RHR" scene "$FULL" --camera=7,4.0,8.2 --look-at=0,2.4,6.2 --out "$RUNNER_TEMP/visual/10-desk-side.png"
          "$RHR" scene "$RUNNER_TEMP/emma-classroom-source.rbxmx" --view iso --out "$RUNNER_TEMP/visual/04-exterior-control.png"
          for name in 01-isometric 02-front 03-top 05-eye-front 06-eye-back 07-eye-windows 08-eye-storage 09-chair-back 10-desk-side; do
            test -s "$RUNNER_TEMP/visual/$name.png"
          done
          # A PNG existing does not mean a room rendered: reject near-white
          # screens from headless browser/renderer failures.
          "$RUNNER_TEMP/rhr-venv/bin/python" - <<'PY'
          from PIL import Image
          from pathlib import Path
          import os
          folder=Path(os.environ["RUNNER_TEMP"])/"visual"
          for name in ("01-isometric","02-front","03-top"):
              im=Image.open(folder/(name+".png")).convert("RGB")
              dynamic=max(b-a for a,b in im.getextrema())
              sample=im.resize((96,54))
              pixels=list(sample.getdata())
              white_ratio=sum(min(rgb)>245 for rgb in pixels)/len(pixels)
              if dynamic<65 or white_ratio>.94:
                  raise RuntimeError(
                      f"Visually blank aerial render {name}: "
                      f"channel_span={dynamic}, white_ratio={white_ratio:.3f}"
                  )
              print(f"VISUAL_NONBLANK_PASS {name} channel_span={dynamic} white_ratio={white_ratio:.3f}")
          PY
          sha256sum "$RUNNER_TEMP"/visual/*.png
          echo "These are source-derived third-party renderer snapshots."
          echo "They do NOT prove Roblox engine, phone gameplay or asset fidelity."

      - name: Emit compact preview images for actual visual inspection
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/rhr-venv/bin/pip" install --disable-pip-version-check 'Pillow==11.3.0'
          "$RUNNER_TEMP/rhr-venv/bin/python" \
            school/emma-classroom/showroom/encode_preview.py "$RUNNER_TEMP/visual"

      - name: Save real rendered source snapshot for human/AI review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emma-classroom-geometry-preview-${{ github.sha }}
          path: |
            ${{ runner.temp }}/visual/*.png
            ${{ runner.temp }}/emma-classroom-source.rbxmx
            ${{ runner.temp }}/emma-classroom-cutaway.rbxmx
          retention-days: 14
          if-no-files-found: warn
