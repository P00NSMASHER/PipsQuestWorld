name: Emma Curriculum Infrastructure CI
on:
  push:
    paths:
      - '.github/workflows/emma-curriculum-infra-ci.yml'
      - '.github/workflows/emma-curriculum-refresh.yml'
      - '.github/emma-curriculum-target.json'
      - '.github/scripts/emma_curriculum_target.py'
      - '.github/scripts/test_emma_curriculum_target.py'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/emma-curriculum-infra-ci.yml'
      - '.github/workflows/emma-curriculum-refresh.yml'
      - '.github/emma-curriculum-target.json'
      - '.github/scripts/emma_curriculum_target.py'
      - '.github/scripts/test_emma_curriculum_target.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate branch-switch rules
        run: python3 -m unittest discover -s .github/scripts -p test_emma_curriculum_target.py -v
      - name: Exercise the current reviewed target
        run: python3 .github/scripts/emma_curriculum_target.py .github/emma-curriculum-target.json
      - name: Rehearse the full current reviewed ABVM-to-game refresh without writing to GitHub
        shell: bash
        run: |
          set -euo pipefail
          target="$(python3 -c 'import json; print(json.load(open(".github/emma-curriculum-target.json"))["activeBranch"])')"
          git fetch --no-tags --depth 1 origin "refs/heads/$target"
          git worktree add --detach "$RUNNER_TEMP/emma-target" FETCH_HEAD
          test -f "$RUNNER_TEMP/emma-target/school/emma-classroom/tools/refresh_curriculum.sh"
          git clone --depth 1 https://github.com/P00NSMASHER/abvmschoolstarworld "$RUNNER_TEMP/abvm-reviewed"
          cp -a "$RUNNER_TEMP/emma-target/school/emma-classroom" "$RUNNER_TEMP/consumer-fixture"
          bash "$RUNNER_TEMP/consumer-fixture/tools/refresh_curriculum.sh" "$RUNNER_TEMP/abvm-reviewed"
          python3 -m unittest discover -s "$RUNNER_TEMP/consumer-fixture/tests" -p test_curriculum_import.py
          python3 - "$RUNNER_TEMP/consumer-fixture/curriculum-receipt.json" <<'PY'
          import json,sys
          receipt=json.load(open(sys.argv[1]))
          assert receipt["imported"] >= 357
          assert receipt["privateLearnerDataIncluded"] is False
          assert receipt["published"] is False
          print("READ_ONLY_CURRICULUM_REHEARSAL:",receipt["imported"],"reviewed questions")
          PY
          printf '\\n-- simulated local generated-bank damage\\n' >> "$RUNNER_TEMP/consumer-fixture/server/QuestionBank.lua"
          bash "$RUNNER_TEMP/consumer-fixture/tools/refresh_curriculum.sh" "$RUNNER_TEMP/abvm-reviewed"
          python3 -m unittest discover -s "$RUNNER_TEMP/consumer-fixture/tests" -p test_curriculum_import.py
          echo 'PASS: real reviewed ABVM source, consumer contract, and generated drift repair in disposable checkout.'
      - name: Parse the scheduled and independent CI workflows
        shell: bash
        run: |
          set -euo pipefail
          ruby -ryaml -e 'ARGV.each {|file| YAML.parse_file(file); puts "YAML_OK: #{file}" }' \
            .github/workflows/emma-curriculum-refresh.yml \
            .github/workflows/emma-curriculum-infra-ci.yml
      - name: Preserve data-only and draft-only controls
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'cron:.*25 \*/4' .github/workflows/emma-curriculum-refresh.yml
          grep -q 'gh pr create .*--draft' .github/workflows/emma-curriculum-refresh.yml
          grep -q 'school/emma-classroom/server/QuestionBank.lua' .github/workflows/emma-curriculum-refresh.yml
          grep -q 'TARGET_BRANCH:' .github/workflows/emma-curriculum-refresh.yml
          grep -q 'git diff --quiet' .github/workflows/emma-curriculum-refresh.yml
          grep -q 'PR_CREATE_PERMISSION_DENIED' .github/workflows/emma-curriculum-refresh.yml
          grep -q 'CANDIDATE_DRIFT' .github/workflows/emma-curriculum-refresh.yml
          grep -q 'CONTENT_CONTRACT_CONNECTED' .github/workflows/emma-curriculum-refresh.yml
          test "$(grep -c 'persist-credentials: false' .github/workflows/emma-curriculum-refresh.yml)" -ge 2
          grep -q 'gh auth setup-git' .github/workflows/emma-curriculum-refresh.yml
          grep -q 'REVIEW_REQUIRED:' .github/workflows/emma-curriculum-refresh.yml
          echo 'PASS: every four hours, target-configurable, content-only candidate, no automatic Roblox release.'
