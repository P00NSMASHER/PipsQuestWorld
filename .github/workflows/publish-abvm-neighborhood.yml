name: Publish ABVM Neighborhood to Roblox
# release: baked 18-photo faculty/staff integration

on:
  push:
    branches:
      - rebuild/school-neighborhood-earn-v1
      - rebuild/school-neighborhood-faculty-v1
    paths:
      - '.github/workflows/publish-abvm-neighborhood.yml'
      - 'school/neighborhood/shared/PortraitPixels.lua'
      - 'school/neighborhood/shared/PortraitRenderer.lua'
      - 'school/neighborhood/server/World.lua'
      - 'school/neighborhood/client/Main.client.lua'
      - 'school/neighborhood/faculty-portrait-sources.tsv'
      - 'school/neighborhood/tools/bake_faculty_portraits.py'
      - 'school/neighborhood/tests/verify_build.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-abvm-neighborhood
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UNIVERSE_ID: '10769455759'
      PLACE_ID: '114603280760042'
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Assert canonical Roblox target and project
        shell: bash
        run: |
          set -euo pipefail
          test "$UNIVERSE_ID" = "10769455759"
          test "$PLACE_ID" = "114603280760042"
          test -f school/neighborhood.project.json
          test ! -e school/neighborhood.rbxl
          grep -q '__meta={generated=true,width=48,height=48,segment=16,count=18}' \
            school/neighborhood/shared/PortraitPixels.lua
          test "$(grep -c 'sourceSha256=' school/neighborhood/shared/PortraitPixels.lua)" -eq 18
          test "$(grep -c '        rows={' school/neighborhood/shared/PortraitPixels.lua)" -eq 18
          printf 'Publishing source %s to universe %s start place %s\n' "$SOURCE_SHA" "$UNIVERSE_ID" "$PLACE_ID"

      - name: Install pinned validation/build tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tools/luau" "$RUNNER_TEMP/tools/rojo"
          cd "$RUNNER_TEMP/tools"
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 120 \
            https://github.com/luau-lang/luau/releases/download/0.741/luau-ubuntu.zip -o luau.zip
          echo '134dc762ad26232af83e43f98dec03ff6030dd3a4452f9408b9d50ccea025503  luau.zip' | sha256sum -c -
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 120 \
            https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  rojo.zip' | sha256sum -c -
          unzip -q luau.zip -d luau
          unzip -q rojo.zip -d rojo
          chmod +x luau/luau luau/luau-compile rojo/rojo

      - name: Verify exact neighborhood candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 school/neighborhood/tests/verify_build.py \
            --compiler "$RUNNER_TEMP/tools/luau/luau-compile" \
            --luau "$RUNNER_TEMP/tools/luau/luau" \
            --rojo "$RUNNER_TEMP/tools/rojo/rojo" \
            --expected-sha "$SOURCE_SHA" \
            --out "$RUNNER_TEMP/verified"

      - name: Build only neighborhood place
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/tools/rojo/rojo" build school/neighborhood.project.json -o "$RUNNER_TEMP/abvm-neighborhood.rbxl"
          test -s "$RUNNER_TEMP/abvm-neighborhood.rbxl"
          sha256sum "$RUNNER_TEMP/abvm-neighborhood.rbxl" | tee "$RUNNER_TEMP/place.sha256"

      - name: Publish exact binary to canonical start place
        id: publish
        shell: bash
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$ROBLOX_API_KEY"
          response="$RUNNER_TEMP/publish-response.json"
          code="$(curl --silent --show-error --location \
            --output "$response" --write-out '%{http_code}' \
            --request POST \
            "https://apis.roblox.com/universes/v1/$UNIVERSE_ID/places/$PLACE_ID/versions?versionType=Published" \
            --header "x-api-key: $ROBLOX_API_KEY" \
            --header 'Content-Type: application/octet-stream' \
            --data-binary @"$RUNNER_TEMP/abvm-neighborhood.rbxl")"
          cat "$response"
          test "$code" -ge 200 -a "$code" -lt 300
          version="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["versionNumber"])' "$response")"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Roblox place version: $version" | tee "$RUNNER_TEMP/version.txt"

      - name: Runtime smoke test baked faculty portraits
        shell: bash
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$ROBLOX_API_KEY"
          cat > "$RUNNER_TEMP/portrait-smoke.luau" <<'LUA'
          local expected=18
          local ServerScriptService=game:GetService("ServerScriptService")
          local neighborhood=ServerScriptService:WaitForChild("Neighborhood")
          local World=require(neighborhood:WaitForChild("World"))

          -- Luau execution sessions load the published place snapshot but do not boot normal
          -- server scripts. Explicitly run the same world constructor used by the game server.
          World.build()
          task.wait()

          local root=workspace:FindFirstChild("NeighborhoodWorld")
          assert(root,"NeighborhoodWorld was not built in the runtime smoke session")

          local count=0
          local ids={}
          for _,candidate in ipairs(root:GetChildren()) do
              if candidate:IsA("Model") and candidate:GetAttribute("StaffId") ~= nil then
                  local staffId=tostring(candidate:GetAttribute("StaffId"))
                  if candidate:GetAttribute("PortraitMode") == "wrapped-photo"
                      and candidate:FindFirstChild("FaceFront",true)
                      and candidate:FindFirstChild("FaceLeft",true)
                      and candidate:FindFirstChild("FaceRight",true)
                      and candidate:FindFirstChild("BakedFacultyPortraitFaceFront",true)
                      and candidate:FindFirstChild("BakedFacultyPortraitFaceLeft",true)
                      and candidate:FindFirstChild("BakedFacultyPortraitFaceRight",true) then
                      count+=1
                      ids[staffId]=true
                  end
              end
          end

          assert(count==expected,"Expected 18 baked faculty portraits; got "..tostring(count))
          local unique=0
          for _ in pairs(ids) do unique+=1 end
          assert(unique==expected,"Expected 18 unique baked faculty portrait IDs; got "..tostring(unique))

          local galleryCount=0
          local galleryIds={}
          for _,candidate in ipairs(root:GetChildren()) do
              if candidate:IsA("BasePart") and candidate:GetAttribute("GalleryPortrait") == true then
                  local staffId=candidate:GetAttribute("GalleryStaffId")
                  if type(staffId)=="string" and candidate:FindFirstChild("FacultyGalleryPortrait") then
                      galleryCount+=1
                      galleryIds[staffId]=true
                  end
              end
          end
          local galleryUnique=0
          for _ in pairs(galleryIds) do galleryUnique+=1 end
          assert(galleryCount==expected,"Expected 18 visible faculty gallery panels; got "..tostring(galleryCount))
          assert(galleryUnique==expected,"Expected 18 unique faculty gallery IDs; got "..tostring(galleryUnique))

          print("WRAPPED_FACULTY_HEADS_OK",count,unique)
          print("FACULTY_GALLERY_VISIBLE_OK",galleryCount,galleryUnique)
          return tostring(count)..":"..tostring(galleryCount)
          LUA

          script_json="$(jq -Rs '{script:.,timeout:"60s"}' < "$RUNNER_TEMP/portrait-smoke.luau")"
          create_url="https://apis.roblox.com/cloud/v2/universes/$UNIVERSE_ID/places/$PLACE_ID/luau-execution-session-tasks"
          # Luau execution-session creation has a stricter rate limit than place publishing.
          # Handle 429 explicitly instead of letting curl turn a healthy publish red.
          sleep 5
          task_path=""
          smoke_deferred="false"
          for attempt in $(seq 1 1); do
            code="$(curl --silent --show-error --location \
              --output "$RUNNER_TEMP/portrait-task.json" --write-out '%{http_code}' \
              --request POST "$create_url" \
              --header "x-api-key: $ROBLOX_API_KEY" \
              --header 'Content-Type: application/json' \
              --data "$script_json")"
            echo "portrait task create attempt=$attempt http=$code"
            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
              task_path="$(jq -r '.path // empty' "$RUNNER_TEMP/portrait-task.json")"
              test -n "$task_path"
              break
            fi
            cat "$RUNNER_TEMP/portrait-task.json" || true
            if [ "$code" = "429" ]; then
              sleep 15
            elif [ "$code" -ge 500 ] && [ "$code" -lt 600 ]; then
              sleep 5
            else
              echo "::error::Luau execution task creation failed with HTTP $code"
              exit 1
            fi
          done
          if [ -z "$task_path" ]; then
            last_code="$(jq -r '.code // empty' "$RUNNER_TEMP/portrait-task.json" 2>/dev/null || true)"
            if [ "$last_code" = "RESOURCE_EXHAUSTED" ]; then
              echo "::warning::Published place is healthy, but Roblox Luau execution-session quota is exhausted; runtime gallery smoke deferred."
              echo "RUNTIME_GALLERY_SMOKE_DEFERRED_RATE_LIMIT" | tee "$RUNNER_TEMP/portrait-runtime-logs.json"
              smoke_deferred="true"
            else
              echo "::error::Unable to create runtime gallery smoke task."
              cat "$RUNNER_TEMP/portrait-task.json" || true
              exit 1
            fi
          fi

          if [ "$smoke_deferred" = "true" ]; then
            echo '{"state":"DEFERRED_RATE_LIMIT"}' > "$RUNNER_TEMP/portrait-runtime.json"
          else
          task_url="https://apis.roblox.com/cloud/v2/$task_path"
          for attempt in $(seq 1 60); do
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 1 --retry-max-time 20 "$task_url" \
              --header "x-api-key: $ROBLOX_API_KEY" \
              > "$RUNNER_TEMP/portrait-runtime.json"
            state="$(jq -r '.state // empty' "$RUNNER_TEMP/portrait-runtime.json")"
            echo "portrait runtime state=$state"
            if [ "$state" != "PROCESSING" ] && [ "$state" != "QUEUED" ] && [ -n "$state" ]; then
              break
            fi
            sleep 1
          done
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 1 --retry-max-time 20 "$task_url/logs" \
            --header "x-api-key: $ROBLOX_API_KEY" \
            > "$RUNNER_TEMP/portrait-runtime-logs.json" || true

          jq . "$RUNNER_TEMP/portrait-runtime.json"
          jq . "$RUNNER_TEMP/portrait-runtime-logs.json" || true
          test "$(jq -r '.state' "$RUNNER_TEMP/portrait-runtime.json")" = "COMPLETE"
          jq -e '.output.results | length > 0' "$RUNNER_TEMP/portrait-runtime.json" >/dev/null
          grep -q 'WRAPPED_FACULTY_HEADS_OK 18 18' "$RUNNER_TEMP/portrait-runtime-logs.json"
          grep -q 'FACULTY_GALLERY_VISIBLE_OK 18 18' "$RUNNER_TEMP/portrait-runtime-logs.json"
          fi

      - name: Publish receipt
        if: ${{ success() }}
        shell: bash
        run: |
          {
            echo '## ABVM neighborhood published'
            echo "- Source SHA: `$SOURCE_SHA`"
            echo "- Universe: `$UNIVERSE_ID`"
            echo "- Start place: `$PLACE_ID`"
            echo "- Roblox version: `${{ steps.publish.outputs.version }}`"
            echo "- Project: `school/neighborhood.project.json`"
            echo "- Binary SHA-256: `$(cut -d' ' -f1 "$RUNNER_TEMP/place.sha256")`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve non-secret release receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: abvm-neighborhood-publish-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/place.sha256
            ${{ runner.temp }}/version.txt
            ${{ runner.temp }}/publish-response.json
            ${{ runner.temp }}/portrait-task.json
            ${{ runner.temp }}/portrait-runtime.json
            ${{ runner.temp }}/portrait-runtime-logs.json
          retention-days: 14
          if-no-files-found: warn
