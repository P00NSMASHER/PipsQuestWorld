# Archived ABVM neighborhood source is preserved. The active Emma Roblox
# place 114603280760042 is owned by the photo-classroom preview release lane.
# This workflow deliberately has NO Roblox API credentials or upload step.
name: Guard Archived ABVM Neighborhood Publication

on:
  workflow_dispatch:
  push:
    branches:
      - rebuild/school-neighborhood-earn-v1
    paths:
      - '.github/workflows/publish-abvm-neighborhood.yml'

permissions:
  contents: read

jobs:
  reject-legacy-shared-place-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Prevent restoring an older neighborhood over Emma's classroom
        run: |
          echo 'LEGACY_NEIGHBORHOOD_NO_PUBLISH: Roblox place 114603280760042'
          echo 'The source remains in Git history and scheduled curriculum tasks continue.'
          echo 'Only photo-classroom-and-hallway preview workflow may publish.'
