name: Publish ABVM Neighborhood to Roblox
# release: gold-standard version 19 houses vehicles
# release: gold-standard visible HUD correction

on:
  push:
    branches:
      - rebuild/school-neighborhood-earn-v1
    paths:
      - '.github/workflows/publish-abvm-neighborhood.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-abvm-neighborhood
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UNIVERSE_ID: '10769455759'
      PLACE_ID: '114603280760042'
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Assert canonical Roblox target and project
        shell: bash
        run: |
          set -euo pipefail
          test "$UNIVERSE_ID" = "10769455759"
          test "$PLACE_ID" = "114603280760042"
          test -f school/neighborhood.project.json
          test ! -e school/neighborhood.rbxl
          printf 'Publishing source %s to universe %s start place %s\n' "$SOURCE_SHA" "$UNIVERSE_ID" "$PLACE_ID"

      - name: Install pinned validation/build tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tools/luau" "$RUNNER_TEMP/tools/rojo"
          cd "$RUNNER_TEMP/tools"
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 120 \
            https://github.com/luau-lang/luau/releases/download/0.741/luau-ubuntu.zip -o luau.zip
          echo '134dc762ad26232af83e43f98dec03ff6030dd3a4452f9408b9d50ccea025503  luau.zip' | sha256sum -c -
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 120 \
            https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  rojo.zip' | sha256sum -c -
          unzip -q luau.zip -d luau
          unzip -q rojo.zip -d rojo
          chmod +x luau/luau luau/luau-compile rojo/rojo

      - name: Verify exact neighborhood candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 school/neighborhood/tests/verify_build.py \
            --compiler "$RUNNER_TEMP/tools/luau/luau-compile" \
            --luau "$RUNNER_TEMP/tools/luau/luau" \
            --rojo "$RUNNER_TEMP/tools/rojo/rojo" \
            --expected-sha "$SOURCE_SHA" \
            --out "$RUNNER_TEMP/verified"

      - name: Build only neighborhood place
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/tools/rojo/rojo" build school/neighborhood.project.json -o "$RUNNER_TEMP/abvm-neighborhood.rbxl"
          test -s "$RUNNER_TEMP/abvm-neighborhood.rbxl"
          sha256sum "$RUNNER_TEMP/abvm-neighborhood.rbxl" | tee "$RUNNER_TEMP/place.sha256"

      - name: Publish exact binary to canonical start place
        id: publish
        shell: bash
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$ROBLOX_API_KEY"
          response="$RUNNER_TEMP/publish-response.json"
          code="$(curl --silent --show-error --location \
            --output "$response" --write-out '%{http_code}' \
            --request POST \
            "https://apis.roblox.com/universes/v1/$UNIVERSE_ID/places/$PLACE_ID/versions?versionType=Published" \
            --header "x-api-key: $ROBLOX_API_KEY" \
            --header 'Content-Type: application/octet-stream' \
            --data-binary @"$RUNNER_TEMP/abvm-neighborhood.rbxl")"
          cat "$response"
          test "$code" -ge 200 -a "$code" -lt 300
          version="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["versionNumber"])' "$response")"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Roblox place version: $version" | tee "$RUNNER_TEMP/version.txt"

      - name: Publish receipt
        if: ${{ success() }}
        shell: bash
        run: |
          {
            echo '## ABVM neighborhood published'
            echo "- Source SHA: `$SOURCE_SHA`"
            echo "- Universe: `$UNIVERSE_ID`"
            echo "- Start place: `$PLACE_ID`"
            echo "- Roblox version: `${{ steps.publish.outputs.version }}`"
            echo "- Project: `school/neighborhood.project.json`"
            echo "- Binary SHA-256: `$(cut -d' ' -f1 "$RUNNER_TEMP/place.sha256")`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve non-secret release receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: abvm-neighborhood-publish-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/place.sha256
            ${{ runner.temp }}/version.txt
            ${{ runner.temp }}/publish-response.json
          retention-days: 14
          if-no-files-found: warn
