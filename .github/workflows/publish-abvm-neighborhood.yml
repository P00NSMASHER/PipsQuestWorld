# The live Emma Roblox place 114603280760042 now belongs to the reviewed
# classroom-and-hallway preview publisher. This historical build remains
# available in source control and CI, but this lane cannot write to Roblox.
name: ABVM Legacy Neighborhood Publish Guard

on:
  push:
    branches:
      - rebuild/school-neighborhood-earn-v1
    paths:
      - '.github/workflows/publish-abvm-neighborhood.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-emma-classroom
  cancel-in-progress: false

jobs:
  archived-publish-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Preserve legacy code but block shared-place publication
        run: |
          echo 'LEGACY_PUBLISH_BLOCKED place=114603280760042 branch=rebuild/school-neighborhood-earn-v1'
          echo 'The archived neighborhood builder also targeted the same Emma Roblox place and must not replace the classroom preview.'
          echo 'No Roblox credential is loaded. No binary is uploaded.'
          echo 'This is intentionally not a scheduler or curriculum shutdown.'
