name: High School Progression Guards

on:
  push:
    branches:
      - "rebuild/high-school-foundation"
      - "rebuild/high-school-progression-*"
      - "rebuild/high-school-interaction-*"
      - "rebuild/high-school-vehicle-*"
      - "rebuild/high-school-legacy-hud-*"
      - "rebuild/high-school-housing-*"
      - "support/high-school-housing-editor-*"
    paths:
      - "school/**"
      - "scripts/verify-school-pivot.py"
      - ".github/workflows/high-school-progression-ci.yml"
  pull_request:
    paths:
      - "school/**"
      - "scripts/verify-school-pivot.py"
      - ".github/workflows/high-school-progression-ci.yml"

permissions:
  contents: read

jobs:
  deterministic-progression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.4
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
      - name: Preserve canonical Foundation invariants
        run: python3 scripts/verify-school-pivot.py
      - name: Parse avatar entry module and verify canonical mount
        run: luac5.4 -p school/src/shared/LegacyOutfitEntry.lua
      - name: Run complete deterministic Lua spec suite
        shell: bash
        run: |
          set -euo pipefail
          for spec in school/tests/*_spec.lua; do
            echo "Running ${spec}"
            lua5.4 "${spec}"
          done
