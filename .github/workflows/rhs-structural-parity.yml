name: RHS Structural Parity

on:
  pull_request:
    paths:
      - "rhs/working/**"
      - "rhs/baseline/**"
      - "rhs/compatibility/PATCH_MANIFEST.json"
      - "tools/rhs-binary-patcher/**"
      - ".github/workflows/rhs-structural-parity.yml"

permissions:
  contents: read

jobs:
  structural-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify recorded binary identities
        run: python3 scripts/verify-rhs-baseline.py

      - name: Cache binary patcher build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            tools/rhs-binary-patcher/target
          key: rhs-binary-patcher-${{ runner.os }}-${{ hashFiles('tools/rhs-binary-patcher/Cargo.toml') }}

      - name: Build pinned binary parity tool
        run: cargo build --manifest-path tools/rhs-binary-patcher/Cargo.toml --release

      - name: Prove exact hierarchy/name/class and script parity
        shell: bash
        run: |
          tools/rhs-binary-patcher/target/release/rhs-binary-patcher parity             "rhs/baseline/ROBLOX High School.rbxl"             "rhs/working/ROBLOX High School.rbxl"             rhs/working/BUILD_RECEIPT.json
