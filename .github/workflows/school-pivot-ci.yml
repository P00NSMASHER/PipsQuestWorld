name: High School Static Guards

on:
  pull_request:
    paths:
      - "school/**"
      - "highschool/**"
      - "scripts/verify-school-pivot.py"
      - ".github/workflows/school-pivot-ci.yml"
      - "README.md"
      - "STATUS.md"
      - "DEVELOPMENT.md"
      - "AGENTS.md"
      - "docs/PIP_HIGH_PIVOT.md"
  push:
    branches:
      - main
      - "rebuild/high-school-*"
    paths:
      - "school/**"
      - "highschool/**"
      - "scripts/verify-school-pivot.py"
      - ".github/workflows/school-pivot-ci.yml"

permissions:
  contents: read

jobs:
  static-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical Foundation invariants
        run: python3 scripts/verify-school-pivot.py
      - name: Install Lua 5.4
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
      - name: Run deterministic highschool Lua specs when present
        shell: bash
        run: |
          if [ ! -d highschool/tests ]; then
            echo "No highschool/tests directory on this head"
            exit 0
          fi
          mapfile -t specs < <(find highschool/tests -type f -name '*_spec.lua' | sort)
          if [ "${#specs[@]}" -eq 0 ]; then
            echo "No highschool Lua specs on this head"
            exit 0
          fi
          for spec in "${specs[@]}"; do
            echo "==> $spec"
            lua5.4 "$spec"
          done
