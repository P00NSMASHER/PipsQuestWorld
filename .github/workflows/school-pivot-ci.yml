name: High School Foundation Static Guards

on:
  pull_request:
    paths:
      - "school/**"
      - "scripts/verify-school-pivot.py"
      - "scripts/verify-foundation-ci-scope.py"
      - ".github/workflows/school-pivot-ci.yml"
      - ".github/workflows/high-school-class-education-ci.yml"
      - ".github/workflows/high-school-progression-ci.yml"
      - "README.md"
      - "STATUS.md"
      - "DEVELOPMENT.md"
      - "AGENTS.md"
      - "docs/PIP_HIGH_PIVOT.md"
  push:
    branches:
      - main
      - rebuild/high-school-foundation
    paths:
      - "school/**"
      - "scripts/verify-school-pivot.py"
      - "scripts/verify-foundation-ci-scope.py"
      - ".github/workflows/school-pivot-ci.yml"
      - ".github/workflows/high-school-class-education-ci.yml"
      - ".github/workflows/high-school-progression-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.4
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
      - name: Verify canonical Foundation invariants
        run: python3 scripts/verify-school-pivot.py
      - name: Verify Foundation CI source-root isolation
        run: python3 scripts/verify-foundation-ci-scope.py
      - name: Run Foundation world contracts
        run: lua5.4 school/tests/foundation_world_contract_spec.lua
      - name: Run housing plot contracts
        run: lua5.4 school/tests/housing_plot_contract_spec.lua
