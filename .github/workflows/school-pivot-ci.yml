name: Pip High Static Guards

on:
  pull_request:
    paths:
      - "school/**"
      - "scripts/verify-school-pivot.py"
      - ".github/workflows/school-pivot-ci.yml"
      - "README.md"
      - "STATUS.md"
      - "DEVELOPMENT.md"
      - "AGENTS.md"
      - "docs/PIP_HIGH_PIVOT.md"
  push:
    branches:
      - main
    paths:
      - "school/**"
      - "scripts/verify-school-pivot.py"

permissions:
  contents: read

jobs:
  static-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify active school project invariants
        run: python3 scripts/verify-school-pivot.py
