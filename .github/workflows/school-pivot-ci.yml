name: High School Foundation Static Guards

on:
  pull_request:
    paths:
      - "school/**"
      - "scripts/verify-school-pivot.py"
      - "scripts/verify-foundation-ci-scope.py"
      - ".github/workflows/school-pivot-ci.yml"
      - ".github/workflows/high-school-class-education-ci.yml"
      - ".github/workflows/high-school-progression-ci.yml"
      - "README.md"
      - "STATUS.md"
      - "DEVELOPMENT.md"
      - "AGENTS.md"
      - "docs/PIP_HIGH_PIVOT.md"
  push:
    branches:
      - main
      - rebuild/high-school-foundation
    paths:
      - "school/**"
      - "scripts/verify-school-pivot.py"
      - "scripts/verify-foundation-ci-scope.py"
      - ".github/workflows/school-pivot-ci.yml"
      - ".github/workflows/high-school-class-education-ci.yml"
      - ".github/workflows/high-school-progression-ci.yml"

permissions:
  contents: read

jobs:
  static-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical Foundation invariants
        run: python3 scripts/verify-school-pivot.py
      - name: Verify Foundation CI source-root isolation
        run: python3 scripts/verify-foundation-ci-scope.py
