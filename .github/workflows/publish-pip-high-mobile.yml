name: Publish Pip High mobile candidate

on:
  push:
    branches:
      - release/pip-high-mobile-558d13f
    paths:
      - .github/workflows/publish-pip-high-mobile.yml
      - release-artifacts/PipHigh-current-558d13f.rbxlx

permissions:
  contents: read

concurrency:
  group: pip-high-mobile-private-publish
  cancel-in-progress: false

jobs:
  publish:
    if: contains(github.event.head_commit.message, '[publish-pip-high]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARTIFACT: release-artifacts/PipHigh-current-558d13f.rbxlx
      EXPECTED_SHA256: 26CFCE53BC5452EA4FFFB97C5506148D836E45C9407EF63A484018632F60F427
      ROBLOX_UNIVERSE_ID: "6027194615"
      ROBLOX_PLACE_ID: "17602626136"
      ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify exact approved candidate
        shell: bash
        run: |
          set -euo pipefail
          test -s "$ARTIFACT"
          echo "$EXPECTED_SHA256  $ARTIFACT" | sha256sum --check --strict
          grep -q 'PipHighEconomyV1' "$ARTIFACT"
          grep -q 'SchoolCampus' "$ARTIFACT"
          grep -q 'CulinaryIsland' "$ARTIFACT"

      - name: Publish exact candidate to confirmed private place
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = await import('node:fs');
          const crypto = await import('node:crypto');
          const bytes = fs.readFileSync(process.env.ARTIFACT);
          const sha256 = crypto.createHash('sha256').update(bytes).digest('hex').toUpperCase();
          if (sha256 !== process.env.EXPECTED_SHA256) throw new Error('artifact hash changed');
          const key = String(process.env.ROBLOX_OPEN_CLOUD_API_KEY || '').trim();
          if (!key) throw new Error('ROBLOX_API_KEY is unavailable');
          const universe = process.env.ROBLOX_UNIVERSE_ID;
          const place = process.env.ROBLOX_PLACE_ID;
          if (universe !== '6027194615' || place !== '17602626136') throw new Error('target binding changed');
          const response = await fetch(
            `https://apis.roblox.com/universes/v1/${universe}/places/${place}/versions?versionType=Published`,
            { method: 'POST', headers: { 'x-api-key': key, 'content-type': 'application/xml' }, body: bytes }
          );
          const text = await response.text();
          if (!response.ok) throw new Error(`publish HTTP ${response.status}: ${text.slice(0, 1200)}`);
          const payload = JSON.parse(text);
          if (!Number.isInteger(payload.versionNumber)) throw new Error('Roblox returned no version number');
          fs.writeFileSync('pip-high-publish-receipt.json', JSON.stringify({
            universeId: universe,
            placeId: place,
            versionNumber: payload.versionNumber,
            artifactSha256: sha256,
            sourceCommit: process.env.GITHUB_SHA,
            publishedAt: new Date().toISOString(),
            publicAccessChanged: false
          }, null, 2) + '\n');
          console.log(`PIP_HIGH_PUBLISHED version=${payload.versionNumber} sha256=${sha256}`);
          NODE

      - name: Upload publication receipt
        uses: actions/upload-artifact@v4
        with:
          name: pip-high-mobile-publish-receipt
          path: pip-high-publish-receipt.json
          if-no-files-found: error
          retention-days: 30
