name: Prepare Reviewed Emma Curriculum
on:
  schedule:
    - cron: '25 */4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emma-curriculum-refresh.yml'
      - '.github/emma-curriculum-target.json'
      - '.github/scripts/emma_curriculum_target.py'
permissions:
  contents: read
concurrency:
  group: emma-reviewed-curriculum-candidate
  cancel-in-progress: false

jobs:
  route:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      branch: ${{ steps.resolve.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Verify reviewed target configuration
        run: python3 -m unittest discover -s .github/scripts -p test_emma_curriculum_target.py
      - id: resolve
        name: Resolve active game branch without trusting source artifacts
        run: python3 .github/scripts/emma_curriculum_target.py .github/emma-curriculum-target.json

  prepare:
    needs: route
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
      pull-requests: write
    env:
      TARGET_BRANCH: ${{ needs.route.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.route.outputs.branch }}
          fetch-depth: 0
          # Run cloned source tests and target-branch importers without a
          # persistent repository write credential in git configuration.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe Actions draft-PR permission without creating a PR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # GitHub can grant pull-requests:write to this job while a repository
          # setting separately forbids Actions from creating pull requests.
          # A guaranteed nonexistent branch makes this a side-effect-free check:
          # 422 (unknown head) means the creation permission gate was passed,
          # whereas 403 signals a permission denial.
          probe="curriculum/emma-pr-permission-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-nonexistent"
          if git ls-remote --exit-code --heads origin "refs/heads/$probe" >/dev/null 2>&1; then
            echo "::error::Permission probe branch unexpectedly exists; not sending API request."
            exit 1
          fi
          response="$RUNNER_TEMP/pr-permission-probe.json"
          status="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
            --request POST "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$(python3 -c 'import json,sys; print(json.dumps({"title":"nonexistent-head permission probe","head":sys.argv[1],"base":sys.argv[2],"draft":True}))' "$probe" "$TARGET_BRANCH")")"
          if [[ "$status" == 422 ]]; then
            echo "PR_CREATE_PERMISSION_ALLOWED: GitHub rejected only the deliberately nonexistent head (HTTP 422); no PR was created."
          elif [[ "$status" == 403 ]]; then
            echo "::error::PR_CREATE_PERMISSION_DENIED: GitHub Actions token cannot create pull requests (HTTP 403). Check Settings > Actions > General > Workflow permissions > Allow GitHub Actions to create and approve pull requests."
            cat "$response"
            exit 1
          else
            echo "::error::PR_CREATE_PERMISSION_INCONCLUSIVE: GitHub returned HTTP $status for the nonexistent-head probe."
            cat "$response"
            exit 1
          fi
      - name: Preserve the independently maintained content adapter
        run: |
          set -euo pipefail
          test -f school/emma-classroom/tools/refresh_curriculum.sh
          test -f school/emma-classroom/tools/import_study_universe.py
          test -f school/emma-classroom/curriculum.json
          test -f school/emma-classroom/server/QuestionBank.lua
          test -f school/emma-classroom/curriculum-receipt.json
          test -f school/emma-classroom.project.json
          test -f school/emma-classroom/server/Main.server.lua
          # A future visual rebuild must not merely carry files while dropping
          # the server-only importer from the playable game's service mapping.
          python3 - <<'PY'
          import json
          from pathlib import Path
          project=json.loads(Path('school/emma-classroom.project.json').read_text())
          server=project['tree']['ServerScriptService']['EmmaStudy']['$path']
          assert server == 'emma-classroom/server', 'Game no longer maps the governed server-only bank'
          main=Path('school/emma-classroom/server/Main.server.lua').read_text()
          assert 'WaitForChild("QuestionBank")' in main, 'Game lost its server-side bank consumer'
          PY
          echo "CONTENT_CONTRACT_CONNECTED: $TARGET_BRANCH"
      - name: Hold only while an existing curriculum draft is under review
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          active="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --jq '.[] | [.base.ref,.head.ref] | @tsv' |
            awk -F '\t' -v target="$TARGET_BRANCH" '$1==target && index($2,"curriculum/emma-abvm-")==1 {n++} END {print n+0}')"
          echo "count=$active" >> "$GITHUB_OUTPUT"
          if [[ "$active" != 0 ]]; then
            echo "PENDING_REVIEW: $active governed curriculum PR(s) already target $TARGET_BRANCH."
            echo "Do not replace a candidate under review; the next poll will resume after it closes."
          fi
      - name: Rebuild content from current reviewed ABVM main
        if: steps.pending.outputs.count == '0'
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/P00NSMASHER/abvmschoolstarworld "$RUNNER_TEMP/abvm-source"
          bash school/emma-classroom/tools/refresh_curriculum.sh "$RUNNER_TEMP/abvm-source"
      - name: Prepare or recover one draft content-only candidate
        if: steps.pending.outputs.count == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files=(school/emma-classroom/curriculum.json school/emma-classroom/server/QuestionBank.lua school/emma-classroom/curriculum-receipt.json)
          if git diff --quiet -- "${files[@]}"; then
            echo "NO_CHANGE: accepted governed curriculum and generated files match."
            exit 0
          fi
          source_sha="$(python3 -c 'import json; print(json.load(open("school/emma-classroom/curriculum-receipt.json"))["sourceCommit"])')"
          [[ "$source_sha" =~ ^[a-f0-9]{40}$ ]]
          # Source and target define candidate identity. A game-branch migration
          # never steals a draft created for another branch.
          target_digest="$(printf '%s' "$TARGET_BRANCH" | sha256sum | cut -c1-8)"
          candidate="curriculum/emma-abvm-${source_sha:0:12}-$target_digest"
          if git ls-remote --exit-code --heads origin "refs/heads/$candidate" >/dev/null 2>&1; then
            echo "RECOVER_CANDIDATE: $candidate exists; never overwrite its reviewed commits."
            # Verify retained candidates are still the exact regenerated reviewed
            # output and contain no unreviewed gameplay, keys or private files.
            # A changed candidate is retained and fails closed, never overwritten.
            git fetch --no-tags origin "refs/heads/$candidate:refs/remotes/origin/$candidate"
            mapfile -t changed < <(git diff --name-only "origin/$TARGET_BRANCH...origin/$candidate")
            [[ "${#changed[@]}" -gt 0 ]] || { echo "::error::STALE_CANDIDATE: retained branch has no reviewable diff."; exit 1; }
            for changed_path in "${changed[@]}"; do
              case "$changed_path" in
                school/emma-classroom/curriculum.json|school/emma-classroom/server/QuestionBank.lua|school/emma-classroom/curriculum-receipt.json) ;;
                *) echo "::error::UNTRUSTED_CANDIDATE_FILE: $changed_path"; exit 1 ;;
              esac
            done
            for file in "${files[@]}"; do
              if ! git show "refs/remotes/origin/$candidate:$file" | cmp -s - "$file"; then
                echo "::error::CANDIDATE_DRIFT: $candidate does not match current validated ABVM output for $file; preserve for manual review."
                exit 1
              fi
            done
            echo "RECOVER_VALIDATED: retained candidate matches exact reviewed ABVM output and content-only file allowlist."
            # Reattempt PR creation after a prior GitHub-token permission error.
            # Preserve deliberately closed/rejected PRs instead of reopening.
            existing="$(gh pr list --state all --head "$candidate" --limit 100 --json number --jq 'length')"
            if [[ "$existing" != 0 ]]; then
              echo "::error::REVIEW_REQUIRED: $candidate has prior closed/open PR history; changed reviewed content is still pending explicit reviewer action."
              echo "REVIEW_REQUIRED: retained $candidate targets $TARGET_BRANCH; no candidate was overwritten or silently discarded." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          else
            git switch -c "$candidate"
            git config user.name "Emma Curriculum Bot"
            git config user.email "actions@users.noreply.github.com"
            git add -- "${files[@]}"
            git commit -m "Prepare reviewed ABVM curriculum $source_sha"
            # Supply the scoped GitHub token only for this post-validation push;
            # exporter and target checkout never inherit a stored write token.
            gh auth setup-git
            git push origin "HEAD:refs/heads/$candidate"
          fi
          cat > "$RUNNER_TEMP/curriculum-pr.md" <<BODY
          Reviewed content-only update for active classroom branch $TARGET_BRANCH, prepared from ABVM commit $source_sha.

          Only curriculum.json, the generated server-only QuestionBank.lua and curriculum-receipt.json are changed. Source tests, deterministic export, provenance/answer-key/privacy validation and importer regressions passed. No private learner responses or grades were copied.

          This PR is draft until independently reviewed. The standalone **Emma Curriculum Contract** check can pass while game visuals are actively rebuilt; game/runtime/device checks remain separately required before any Roblox release. Bot-generated PRs may need an independently authorized review action to trigger checks.

          **Never auto-merge, edit PUBLISH_REQUEST, publish Roblox, or claim real-device acceptance.**
          BODY
          if ! gh pr create --base "$TARGET_BRANCH" --head "$candidate" --draft \
            --title "Prepare reviewed ABVM schoolwork for Emma" --body-file "$RUNNER_TEMP/curriculum-pr.md"; then
            echo "::error::Prepared content exists on $candidate, but GitHub refused PR creation. Check Actions pull-request creation permission, then rerun; the next scheduled run will retry without rewriting the branch."
            exit 1
          fi
      - name: Preserve the review receipt even when GitHub refuses a draft PR
        if: always() && steps.pending.outputs.count == '0'
        uses: actions/upload-artifact@v4
        with:
          name: emma-curriculum-preparation-${{ github.run_id }}
          path: |
            school/emma-classroom/curriculum-receipt.json
          if-no-files-found: warn
          retention-days: 14
