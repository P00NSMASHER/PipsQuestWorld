name: Bootstrap Licensed RHS Baseline

on:
  push:
    branches:
      - rebuild/rhs-licensed-exact
    paths:
      - ".github/workflows/bootstrap-rhs-licensed-baseline.yml"
      - "rhs/BASELINE.json"

permissions:
  contents: write

concurrency:
  group: bootstrap-rhs-licensed-baseline
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: rebuild/rhs-licensed-exact

      - name: Download exact pinned licensed build
        shell: bash
        run: |
          set -euo pipefail
          URL='https://raw.githubusercontent.com/MisoNotSoupx/Old-Roblox-Place-Archive/b817aef0eaf77d3382acacdc8f22537e54c76822/Created%20by%20Users/Cindering/ROBLOX%20High%20School.rbxl'
          EXPECTED_SHA='d71efe44c35a60cb1699c290aed708d901a3a532db74307ae502518616423360'
          EXPECTED_BYTES='2283775'

          curl -L --fail --retry 3 "$URL" -o /tmp/rhs.rbxl
          test "$(stat -c %s /tmp/rhs.rbxl)" = "$EXPECTED_BYTES"
          echo "$EXPECTED_SHA  /tmp/rhs.rbxl" | sha256sum -c -

          mkdir -p rhs/baseline rhs/working
          cp /tmp/rhs.rbxl "rhs/baseline/ROBLOX High School.rbxl"
          cp /tmp/rhs.rbxl "rhs/working/ROBLOX High School.rbxl"

          python3 scripts/verify-rhs-baseline.py

      - name: Record exact import receipt
        shell: bash
        run: |
          cat > rhs/IMPORT_RECEIPT.json <<'JSON'
          {
            "schemaVersion": 1,
            "sourceRepository": "MisoNotSoupx/Old-Roblox-Place-Archive",
            "sourceCommit": "b817aef0eaf77d3382acacdc8f22537e54c76822",
            "sourcePath": "Created by Users/Cindering/ROBLOX High School.rbxl",
            "sourceGitBlobSha": "95ee3d762f419bb3572e18db57c03682651dc8c4",
            "bytes": 2283775,
            "sha256": "d71efe44c35a60cb1699c290aed708d901a3a532db74307ae502518616423360",
            "baselinePath": "rhs/baseline/ROBLOX High School.rbxl",
            "workingPath": "rhs/working/ROBLOX High School.rbxl",
            "workingInitiallyByteIdentical": true
          }
          JSON

      - name: Commit exact baseline and working copy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "RHS Baseline Import Bot"
          git config user.email "actions@users.noreply.github.com"
          git add rhs/baseline rhs/working rhs/IMPORT_RECEIPT.json

          if git diff --cached --quiet; then
            echo "Exact RHS baseline already imported."
            exit 0
          fi

          git commit -m "Import exact licensed ROBLOX High School baseline"
          git push origin HEAD:rebuild/rhs-licensed-exact
