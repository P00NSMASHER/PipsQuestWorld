name: RHS Startup Risk Audit

on:
  pull_request:
    paths:
      - "scripts/rhs-startup-risk-audit.py"
      - ".github/workflows/rhs-startup-risk-audit.yml"
      - "rhs/working/ROBLOX High School.rbxl"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned working build
        run: python3 scripts/verify-rhs-baseline.py
      - name: Build pinned Roblox converter
        shell: bash
        run: |
          set -euo pipefail
          cargo install --git https://github.com/rojo-rbx/rbx-dom.git \
            --rev 43d1f129f2eb1fd055512f039863ff35ae5a10f1 \
            --locked rbx_util
      - name: Convert working build
        run: rbx-util convert "rhs/working/ROBLOX High School.rbxl" /tmp/rhs-working.rbxlx
      - name: Classify startup-sensitive scripts
        run: |
          python3 scripts/rhs-startup-risk-audit.py \
            --xml /tmp/rhs-working.rbxlx \
            --output /tmp/rhs-startup-risk.json
      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: rhs-startup-risk
          path: /tmp/rhs-startup-risk.json
          if-no-files-found: error
          retention-days: 30
