name: RHS Baseline Integrity

on:
  pull_request:
    paths:
      - "rhs/**"
      - "scripts/verify-rhs-baseline.py"
      - "scripts/verify-rhs-preflight.py"
      - ".github/workflows/rhs-baseline-guard.yml"
      - "README.md"
      - "STATUS.md"
      - "AGENTS.md"
      - "DEVELOPMENT.md"
      - "docs/RHS_LICENSED_EXACT_COPY.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  baseline-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable licensed baseline
        run: python3 scripts/verify-rhs-baseline.py
      - name: Verify durable static preflight
        run: python3 scripts/verify-rhs-preflight.py
