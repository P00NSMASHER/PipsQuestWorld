name: Emma Grade 2 source-locked review preview (2026-10-20)

# One isolated preview, never a general-purpose classroom publisher.
# The first workflow-only commit runs a safe rehearsal. Only a second,
# uniquely authorized one-file request commit may upload to Roblox.
on:
  push:
    branches:
      - preview/emma-grade2-source-locked-20261020-c6aea756
    paths:
      - '.github/workflows/publish-emma-review-20261020.yml'
      - 'school/emma-classroom/REVIEW_PREVIEW_REQUEST_20261020'

permissions:
  contents: read

concurrency:
  group: publish-emma-classroom
  cancel-in-progress: false

jobs:
  guarded-review-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PRODUCT_SOURCE_SHA: c6aea7568659186b9eea73a855a7abe7b8d9e13e
      TARGET_UNIVERSE: '10769455759'
      TARGET_PLACE: '114603280760042'
      WORKFLOW_PATH: .github/workflows/publish-emma-review-20261020.yml
      REQUEST_PATH: school/emma-classroom/REVIEW_PREVIEW_REQUEST_20261020
      RELEASE_BRANCH: preview/emma-grade2-source-locked-20261020-c6aea756
    steps:
      - name: Check out the immutable event commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false

      - name: Verify one-time user authority, exact product source, and sole changed path
        id: authority
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'P00NSMASHER/PipsQuestWorld'
          test "$GITHUB_EVENT_NAME" = 'push'
          test "$GITHUB_REF_NAME" = "$RELEASE_BRANCH"
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$(git rev-parse --verify "$PRODUCT_SOURCE_SHA^{commit}")" = "$PRODUCT_SOURCE_SHA"
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          parent="$(git rev-parse HEAD^)"
          if test "$changed" = "$WORKFLOW_PATH"; then
            # Safe preparation commit; no secret is supplied to any step.
            test "$parent" = "$PRODUCT_SOURCE_SHA"
            test ! -e "$REQUEST_PATH"
            test "$(git diff --name-only "$PRODUCT_SOURCE_SHA" HEAD)" = "$WORKFLOW_PATH"
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo 'PREVIEW_PREPARATION_ONLY_NO_ROBLOX_CALL'
          elif test "$changed" = "$REQUEST_PATH"; then
            # One-use request must be newly introduced on this precise HEAD.
            test "$(git rev-parse HEAD^^)" = "$PRODUCT_SOURCE_SHA"
            test "$(git diff-tree --no-commit-id --name-only -r HEAD^)" = "$WORKFLOW_PATH"
            if git cat-file -e "HEAD^:$REQUEST_PATH" >/dev/null 2>&1; then
              echo 'REJECT_REUSED_PREVIEW_MARKER' >&2; exit 1
            fi
            test "$(git diff --name-only "$PRODUCT_SOURCE_SHA" HEAD)" = "$(printf '%s\n%s' "$WORKFLOW_PATH" "$REQUEST_PATH")"
            grep -qx 'requested-mode: classroom-review-preview-only' "$REQUEST_PATH"
            grep -qx 'authorization: user-approved-2026-10-20-publish-what-we-have-for-review' "$REQUEST_PATH"
            grep -qx 'source-branch: preview/emma-grade2-source-locked-20261020-c6aea756' "$REQUEST_PATH"
            grep -qx 'product-source-sha: c6aea7568659186b9eea73a855a7abe7b8d9e13e' "$REQUEST_PATH"
            grep -qx "source-parent-sha: $parent" "$REQUEST_PATH"
            grep -qx 'target-universe: 10769455759' "$REQUEST_PATH"
            grep -qx 'target-place: 114603280760042' "$REQUEST_PATH"
            grep -qx 'build-project: school/emma-showroom.project.json' "$REQUEST_PATH"
            grep -qx 'native-device-acceptance: pending' "$REQUEST_PATH"
            grep -qx 'teacher-portrait-acceptance: pending' "$REQUEST_PATH"
            grep -qx 'final-release-acceptance: HOLD' "$REQUEST_PATH"
            test "$(wc -l < "$REQUEST_PATH" | tr -d ' ')" = '11'
            echo 'publish=true' >> "$GITHUB_OUTPUT"
            echo "FRESH_ONETIME_USER_PREVIEW_AUTHORITY_PASS product=$PRODUCT_SOURCE_SHA"
          else
            echo 'REJECT_UNRECOGNIZED_PUBLISH_TRIGGER' >&2; exit 1
          fi
          # Neither preparation nor one-use request may change any actual
          # classroom, portrait, QA, or already reviewed product file.
          ! git diff --name-only "$PRODUCT_SOURCE_SHA" HEAD -- school/emma-showroom.project.json school/emma-classroom/showroom school/emma-classroom/server school/emma-classroom/shared | grep -q .
          echo "SOURCE_SNAPSHOT_IMMUTABLE_PASS=$PRODUCT_SOURCE_SHA"
          echo 'Preview is for real-device review; final acceptance remains HOLD.' >> "$GITHUB_STEP_SUMMARY"

      - name: Install checksum-pinned Luau and Rojo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tools/luau" "$RUNNER_TEMP/tools/rojo"
          cd "$RUNNER_TEMP/tools"
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 120 https://github.com/luau-lang/luau/releases/download/0.741/luau-ubuntu.zip -o luau.zip
          echo '134dc762ad26232af83e43f98dec03ff6030dd3a4452f9408b9d50ccea025503  luau.zip' | sha256sum -c -
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 120 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  rojo.zip' | sha256sum -c -
          unzip -q luau.zip -d luau
          unzip -q rojo.zip -d rojo
          chmod +x luau/luau luau/luau-compile rojo/rojo

      - name: Repeat source geometry, privacy, navigation, and classroom-only gates
        shell: bash
        run: |
          set -euo pipefail
          LUAU="$RUNNER_TEMP/tools/luau/luau"
          for file in school/emma-classroom/showroom/*.lua school/emma-classroom/server/StaffModel.lua; do
            "$RUNNER_TEMP/tools/luau/luau-compile" "$file" >/dev/null
          done
          python3 school/emma-classroom/showroom/verify_build.py
          python3 school/emma-classroom/showroom/audit_owner_polish.py --luau "$LUAU"
          python3 school/emma-classroom/tests/geometry_behavior.py --luau "$LUAU"
          python3 school/emma-classroom/showroom/audit_hallway_camera_layout.py --self-test
          python3 school/emma-classroom/showroom/audit_hallway_camera_layout.py --luau "$LUAU"
          python3 school/emma-classroom/showroom/audit_hallway_mobile_complexity.py --luau "$LUAU"
          python3 school/emma-classroom/showroom/audit_hallway_photo.py --luau "$LUAU"
          python3 school/emma-classroom/showroom/audit_left_hall_junction.py --luau "$LUAU"
          python3 school/emma-classroom/showroom/audit_glazed_door_aperture.py --luau "$LUAU"
          python3 school/emma-classroom/showroom/walkability_audit.py --self-test
          python3 school/emma-classroom/showroom/walkability_audit.py --luau "$LUAU" --out "$RUNNER_TEMP/navigation.json"
          grep -q 'Enabled = false' school/emma-classroom/showroom/FurnitureMeshConfig.lua
          ! grep -q 'buildFoldingMat(' school/emma-classroom/showroom/Room.lua

      - name: Build exact reviewed classroom preview
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/tools/rojo/rojo" build school/emma-showroom.project.json -o "$RUNNER_TEMP/emma-grade2-review.rbxl"
          "$RUNNER_TEMP/tools/rojo/rojo" build school/emma-showroom.project.json -o "$RUNNER_TEMP/emma-grade2-review.rbxlx"
          test -s "$RUNNER_TEMP/emma-grade2-review.rbxl"
          python3 school/emma-classroom/showroom/verify_build.py "$RUNNER_TEMP/emma-grade2-review.rbxlx"
          sha256sum "$RUNNER_TEMP/emma-grade2-review.rbxl" | tee "$RUNNER_TEMP/preview-binary.sha256"
          printf '%s\n' "$PRODUCT_SOURCE_SHA" > "$RUNNER_TEMP/product-source-sha.txt"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/one-use-event-sha.txt"
          echo "EXACT_SOURCE_BUILD_PASS product=$PRODUCT_SOURCE_SHA"

      - name: Publish fresh one-time review preview to existing Roblox place
        if: steps.authority.outputs.publish == 'true'
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ROBLOX_API_KEY"
          response="$RUNNER_TEMP/publish-response.json"
          code="$(curl --silent --show-error --location --output "$response" --write-out '%{http_code}' --request POST \
            "https://apis.roblox.com/universes/v1/$TARGET_UNIVERSE/places/$TARGET_PLACE/versions?versionType=Published" \
            --header "x-api-key: $ROBLOX_API_KEY" \
            --header 'Content-Type: application/octet-stream' \
            --data-binary @"$RUNNER_TEMP/emma-grade2-review.rbxl")"
          test "$code" -ge 200 -a "$code" -lt 300
          version="$(python3 -c 'import json,sys; v=json.load(open(sys.argv[1]))["versionNumber"]; assert isinstance(v,int) and v>0; print(v)' "$response")"
          printf 'versionNumber=%s\n' "$version" | tee "$RUNNER_TEMP/version.txt"
          echo "REVIEW_PREVIEW_PUBLISHED version=$version product=$PRODUCT_SOURCE_SHA event=$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'Native iPhone/Studio review and separate teacher portrait acceptance are still pending.' >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve source and publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emma-grade2-review-preview-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/preview-binary.sha256
            ${{ runner.temp }}/product-source-sha.txt
            ${{ runner.temp }}/one-use-event-sha.txt
            ${{ runner.temp }}/navigation.json
            ${{ runner.temp }}/publish-response.json
            ${{ runner.temp }}/version.txt
          retention-days: 14
          if-no-files-found: warn
