# The live Emma Roblox place 114603280760042 now belongs to the reviewed
# classroom-and-hallway preview publisher. This historical build remains
# available in source control and CI, but this lane cannot write to Roblox.
name: Emma Superseded Replica Publish Guard

on:
  push:
    branches:
      - visual/emma-classroom-replica-only-20261008
    paths:
      - 'school/emma-classroom/PREVIEW_REQUEST'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-emma-classroom
  cancel-in-progress: false

jobs:
  archived-publish-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Preserve legacy code but block shared-place publication
        run: |
          echo 'LEGACY_PUBLISH_BLOCKED place=114603280760042 branch=visual/emma-classroom-replica-only-20261008'
          echo 'An older replica preview must not replace the newer photo-grounded classroom-and-hallway candidate.'
          echo 'No Roblox credential is loaded. No binary is uploaded.'
          echo 'This is intentionally not a scheduler or curriculum shutdown.'
