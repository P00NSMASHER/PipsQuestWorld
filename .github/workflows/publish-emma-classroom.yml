name: Publish Emma Classroom and Photo Hallway Preview

# October 20 one-use review preview: pinned verified classroom product source.
# THIS IS NOT native-device/teacher-likeness acceptance or a reusable release approval.
# The exact source is locked to the existing six-check-green PR #355 head.
on:
  push:
    branches:
      - release/emma-review-as-is-20261020-c6aea756
    paths:
      - 'school/emma-classroom/PREVIEW_REQUEST'

permissions:
  contents: read

concurrency:
  group: publish-emma-classroom
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      UNIVERSE_ID: '10769455759'
      PLACE_ID: '114603280760042'
      SOURCE_SHA: ${{ github.sha }}
      PRODUCT_SHA: 'c6aea7568659186b9eea73a855a7abe7b8d9e13e'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false

      - name: Install pinned Luau and Rojo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tools/luau" "$RUNNER_TEMP/tools/rojo"
          cd "$RUNNER_TEMP/tools"
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 120             https://github.com/luau-lang/luau/releases/download/0.741/luau-ubuntu.zip -o luau.zip
          echo '134dc762ad26232af83e43f98dec03ff6030dd3a4452f9408b9d50ccea025503  luau.zip' | sha256sum -c -
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 120             https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  rojo.zip' | sha256sum -c -
          unzip -q luau.zip -d luau
          unzip -q rojo.zip -d rojo
          chmod +x luau/luau luau/luau-compile rojo/rojo

      - name: Require one-use source-locked review-only classroom preview
        shell: bash
        run: |
          set -euo pipefail
          # The only authorized writer to the shared Emma place is the
          # reviewed photo-guided classroom+hallway source, never the
          # quiz game or the old classroom-only parent PR.
          test "$GITHUB_EVENT_NAME" = 'push'
          test "$GITHUB_REF_NAME" = 'release/emma-review-as-is-20261020-c6aea756'
          test "$GITHUB_ACTOR" = 'P00NSMASHER'
          request=school/emma-classroom/PREVIEW_REQUEST
          test -f "$request"
          grep -qx 'requested-mode: classroom-and-hallway-preview-only' "$request"
          grep -qx 'authorization: user-approved-2026-10-20-review-as-is-preview' "$request"
          grep -qx 'visual-acceptance: pending-real-device-review' "$request"
          grep -qx 'target-universe: 10769455759' "$request"
          grep -qx 'target-place: 114603280760042' "$request"
          grep -qx 'build-project: school/emma-showroom.project.json' "$request"
          grep -qx 'source-branch: release/emma-review-as-is-20261020-c6aea756' "$request"
          grep -qx "product-source-sha: $PRODUCT_SHA" "$request"
          test "$(wc -l < "$request" | tr -d ' ')" = '9'
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          test "$changed" = "$request"
          source_parent="$(git rev-parse HEAD^)"
          grep -qx "source-parent-sha: $source_parent" "$request"
          test "$(git rev-parse HEAD^^)" = "$PRODUCT_SHA"
          test "$(git rev-list --count "$PRODUCT_SHA"..HEAD)" = '2'
          test "$(git diff --name-only "$PRODUCT_SHA" "$source_parent")" = '.github/workflows/publish-emma-classroom.yml'
          test -f school/emma-classroom/showroom/audit_hallway_photo.py
          test -f school/emma-classroom/showroom/audit_glazed_door_aperture.py
          echo "REVIEW_PREVIEW_ONE_USE_SOURCE_LOCK_PASS product=$PRODUCT_SHA marker=$SOURCE_SHA"
          echo "Review-only preview; device/portrait acceptance and production release gates remain HOLD."
          for file in school/emma-classroom/showroom/*.lua school/emma-classroom/showroom/ArtPass.lua; do
            "$RUNNER_TEMP/tools/luau/luau-compile" "$file" >/dev/null
          done
          python3 school/emma-classroom/showroom/verify_build.py
          # Keep lighting acceptance as a release prerequisite, not merely
          # an optional screenshot check. This runs the actual Luau room and
          # gallery constructors with the same pinned executable as CI.
          python3 school/emma-classroom/showroom/audit_lighting.py \
            --luau "$RUNNER_TEMP/tools/luau/luau"
          # Native iPhone v70 exposed blank-facing storybooks. Assert actual
          # SurfaceGui direction and original illustrated physical cover fronts.
          python3 school/emma-classroom/showroom/audit_storybook_facing.py \
            --luau "$RUNNER_TEMP/tools/luau/luau"
          # Non-uniform Ball parts render at the MINIMUM axis diameter
          # on native Roblox clients; ban the dotted rug regression.
          python3 school/emma-classroom/showroom/audit_native_rug_primitives.py \
            --luau "$RUNNER_TEMP/tools/luau/luau"
          # Native phone: previous foliage Balls were flattened to thin
          # minimum-axis silhouettes, akin to the carpet-dot regression.
          python3 school/emma-classroom/showroom/audit_native_foliage_primitives.py \
            --luau "$RUNNER_TEMP/tools/luau/luau"
          # Chair ventilation cannot regress to dot-like flattened Balls.
          python3 school/emma-classroom/showroom/audit_native_chair_vents.py \
            --luau "$RUNNER_TEMP/tools/luau/luau"
          # The child-reported purple corner chair is a separate, approved
          # fallback chair, not a 17th student desk seat or mesh-swap target.
          python3 school/emma-classroom/showroom/audit_purple_corner_chair.py \
            --luau "$RUNNER_TEMP/tools/luau/luau"
          # Real classroom has separate left-window S'more signage and
          # right-window affirmation, plus the compact left-window AC.
          python3 school/emma-classroom/showroom/audit_window_landmarks.py \
            --luau "$RUNNER_TEMP/tools/luau/luau"
          # Exact photo landmark geometry, joinery and doorway clearance.
          python3 school/emma-classroom/showroom/audit_photo_landmarks.py \
            --luau "$RUNNER_TEMP/tools/luau/luau"
          python3 school/emma-classroom/showroom/audit_literacy_wall.py \
            --luau "$RUNNER_TEMP/tools/luau/luau"
          python3 school/emma-classroom/showroom/audit_checkered_table.py \
            --luau "$RUNNER_TEMP/tools/luau/luau"
          python3 school/emma-classroom/showroom/audit_word_wall_native.py \
            --luau "$RUNNER_TEMP/tools/luau/luau"
          # Photo-grounded October 10 corridor and iPhone artifact regressions.
          python3 school/emma-classroom/showroom/audit_hallway_photo.py \
            --luau "$RUNNER_TEMP/tools/luau/luau"
          python3 school/emma-classroom/showroom/audit_glazed_door_aperture.py \
            --luau "$RUNNER_TEMP/tools/luau/luau"
          python3 school/emma-classroom/showroom/audit_notebook_rule_surfaces.py \
            --luau "$RUNNER_TEMP/tools/luau/luau"
          python3 school/emma-classroom/showroom/audit_rug_ui.py \
            --luau "$RUNNER_TEMP/tools/luau/luau"
          python3 school/emma-classroom/tests/furniture_adapter_runtime.py --luau "$RUNNER_TEMP/tools/luau/luau"
          python3 school/emma-classroom/showroom/walkability_audit.py --self-test
          python3 school/emma-classroom/showroom/walkability_audit.py --luau "$RUNNER_TEMP/tools/luau/luau" --out "$RUNNER_TEMP/navigation.json"
          grep -q 'Enabled = false' school/emma-classroom/showroom/FurnitureMeshConfig.lua

      - name: Build replica with NO educational runtime
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/tools/rojo/rojo" build school/emma-showroom.project.json -o "$RUNNER_TEMP/emma-replica.rbxl"
          test -s "$RUNNER_TEMP/emma-replica.rbxl"
          "$RUNNER_TEMP/tools/rojo/rojo" build school/emma-showroom.project.json -o "$RUNNER_TEMP/emma-replica.rbxlx"
          python3 school/emma-classroom/showroom/verify_build.py "$RUNNER_TEMP/emma-replica.rbxlx"
          sha256sum "$RUNNER_TEMP/emma-replica.rbxl" | tee "$RUNNER_TEMP/place.sha256"
          printf '%s\n' "$PRODUCT_SHA" > "$RUNNER_TEMP/product-source-sha.txt"
          printf '%s\n' "$SOURCE_SHA" > "$RUNNER_TEMP/marker-source-sha.txt"
          cp school/emma-classroom/PREVIEW_REQUEST "$RUNNER_TEMP/approved-preview-request.txt"

      - name: Publish exact classroom binary
        id: publish
        shell: bash
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$ROBLOX_API_KEY"
          response="$RUNNER_TEMP/publish-response.json"
          code="$(curl --silent --show-error --location             --output "$response" --write-out '%{http_code}'             --request POST             "https://apis.roblox.com/universes/v1/$UNIVERSE_ID/places/$PLACE_ID/versions?versionType=Published"             --header "x-api-key: $ROBLOX_API_KEY"             --header 'Content-Type: application/octet-stream'             --data-binary @"$RUNNER_TEMP/emma-replica.rbxl")"
          cat "$response"
          test "$code" -ge 200 -a "$code" -lt 300
          version="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["versionNumber"])' "$response")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Roblox place version: $version" | tee "$RUNNER_TEMP/version.txt"
          echo "Published exact GitHub source $SOURCE_SHA to known Roblox place $PLACE_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "REVIEW-ONLY classroom + straight staff hallway preview; teacher portrait and device acceptance NOT approved." >> "$GITHUB_STEP_SUMMARY"
          echo "Mobile engine, collisions, legibility and frame rate must be reviewed in Roblox on iPhone." >> "$GITHUB_STEP_SUMMARY"

      - name: Receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: emma-replica-publish-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/place.sha256
            ${{ runner.temp }}/version.txt
            ${{ runner.temp }}/publish-response.json
            ${{ runner.temp }}/navigation.json
            ${{ runner.temp }}/product-source-sha.txt
            ${{ runner.temp }}/marker-source-sha.txt
            ${{ runner.temp }}/approved-preview-request.txt
          retention-days: 14
          if-no-files-found: warn
