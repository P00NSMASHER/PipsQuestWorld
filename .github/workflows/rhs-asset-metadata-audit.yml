name: RHS Asset Metadata Audit

on:
  push:
    branches:
      - audit/rhs-asset-metadata
    paths:
      - "scripts/rhs-asset-metadata-audit.py"
      - ".github/workflows/rhs-asset-metadata-audit.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: rhs-asset-metadata-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download latest completed survivability evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, urllib.request
          url = "https://api.github.com/repos/P00NSMASHER/PipsQuestWorld/actions/artifacts/11168394358/zip"
          req = urllib.request.Request(
              url,
              headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "PipsQuestWorld-RHS-Asset-Metadata-Audit/1.0",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              data = resp.read()
          open("/tmp/rhs-asset-survivability.zip", "wb").write(data)
          print("ARTIFACT_BYTES", len(data))
          PY
          mkdir -p /tmp/rhs-asset-survivability
          unzip -q /tmp/rhs-asset-survivability.zip -d /tmp/rhs-asset-survivability
          test -f /tmp/rhs-asset-survivability/rhs-asset-impact-report.json

      - name: Identify top unresolved assets through public Roblox metadata
        run: |
          python3 scripts/rhs-asset-metadata-audit.py \
            --impact /tmp/rhs-asset-survivability/rhs-asset-impact-report.json \
            --output /tmp/rhs-asset-metadata.json \
            --top 100 \
            --timeout 10 \
            --retries 3 \
            --interval 0.2

      - name: Upload metadata evidence
        uses: actions/upload-artifact@v4
        with:
          name: rhs-asset-metadata
          path: /tmp/rhs-asset-metadata.json
          if-no-files-found: error
          retention-days: 30
