name: RHS Asset Metadata Audit

on:
  push:
    branches:
      - audit/rhs-asset-metadata
    paths:
      - "scripts/rhs-asset-metadata-audit.py"
      - ".github/workflows/rhs-asset-metadata-audit.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: rhs-asset-metadata-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download latest completed survivability evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "User-Agent: PipsQuestWorld-RHS-Asset-Metadata-Audit/1.0" \
            "https://api.github.com/repos/P00NSMASHER/PipsQuestWorld/actions/artifacts/11168394358/zip" \
            -o /tmp/rhs-asset-survivability.zip
          echo "ARTIFACT_BYTES $(stat -c %s /tmp/rhs-asset-survivability.zip)"
          mkdir -p /tmp/rhs-asset-survivability
          unzip -q /tmp/rhs-asset-survivability.zip -d /tmp/rhs-asset-survivability
          test -f /tmp/rhs-asset-survivability/rhs-asset-impact-report.json
          test -f /tmp/rhs-asset-survivability/rhs-asset-public-probe.json
          test -f /tmp/rhs-asset-survivability/rhs-asset-reference-map.json

      - name: Correct saved permission classifications without re-probing
        run: |
          python3 scripts/rhs-asset-probe-reclassify.py \
            --input /tmp/rhs-asset-survivability/rhs-asset-public-probe.json \
            --output /tmp/rhs-asset-public-probe-corrected.json
          python3 scripts/rhs-asset-impact-report.py \
            --map /tmp/rhs-asset-survivability/rhs-asset-reference-map.json \
            --probe /tmp/rhs-asset-public-probe-corrected.json \
            --output /tmp/rhs-asset-impact-corrected.json \
            --top 100

      - name: Identify top unresolved assets through public Roblox metadata
        run: |
          python3 scripts/rhs-asset-metadata-audit.py \
            --impact /tmp/rhs-asset-impact-corrected.json \
            --output /tmp/rhs-asset-metadata.json \
            --top 100 \
            --timeout 10 \
            --retries 3 \
            --interval 0.2

      - name: Upload metadata evidence
        uses: actions/upload-artifact@v4
        with:
          name: rhs-asset-metadata
          path: |
            /tmp/rhs-asset-metadata.json
            /tmp/rhs-asset-public-probe-corrected.json
            /tmp/rhs-asset-impact-corrected.json
          if-no-files-found: error
          retention-days: 30
