name: RHS House Furniture Context

on:
  push:
    branches:
      - hardening/rhs-house-furniture-trust-v2
    paths:
      - ".github/workflows/rhs-house-furniture-context.yml"

permissions:
  contents: read

jobs:
  context:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify candidate identity
        run: |
          python3 scripts/verify-rhs-baseline.py
          python3 scripts/verify-rhs-preflight.py

      - name: Build pinned Roblox converter
        shell: bash
        run: |
          set -euo pipefail
          cargo install --git https://github.com/rojo-rbx/rbx-dom.git \
            --rev 43d1f129f2eb1fd055512f039863ff35ae5a10f1 \
            --locked rbx_util

      - name: Convert working build
        run: rbx-util convert "rhs/working/ROBLOX High School.rbxl" /tmp/rhs-working.rbxlx

      - name: Print house/furniture remote context
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import re
          import xml.etree.ElementTree as ET

          root=ET.parse("/tmp/rhs-working.rbxlx").getroot()
          script_classes={"Script","LocalScript","ModuleScript"}

          def prop_text(item,name):
              props=item.find("Properties")
              if props is None:
                  return ""
              for p in props:
                  if p.attrib.get("name")!=name:
                      continue
                  if p.tag=="Content":
                      child=next(iter(p),None)
                      return (child.text or "") if child is not None else ""
                  return p.text or ""
              return ""

          def item_name(item):
              return prop_text(item,"Name") or "(unnamed)"

          def walk(parent,prefix=""):
              for item in parent.findall("Item"):
                  nm=item_name(item).replace("/","_")
                  path=f"{prefix}/{nm}" if prefix else nm
                  yield item,path
                  yield from walk(item,path)

          server_target="ServerScriptService/CustomHouseScript_NEW"
          house_remote_names=set()
          server_source=None
          server_sha=None

          for item,path in walk(root):
              if path!=server_target:
                  continue
              server_source=prop_text(item,"Source")
              server_sha=hashlib.sha256(server_source.encode()).hexdigest()
              break

          if not server_source:
              raise SystemExit("missing CustomHouseScript_NEW")

          lines=server_source.splitlines()
          handler_rx=re.compile(r"RemoteFunctions\.([A-Za-z0-9_ ]+)\.(OnServerEvent|OnServerInvoke)")
          starts=[]
          for i,line in enumerate(lines,1):
              m=handler_rx.search(line)
              if m:
                  house_remote_names.add(m.group(1))
                  starts.append((i,m.group(1),m.group(2)))

          print("=== LOAD_HOUSE_EXACT_CONTEXT ===")
          for n in range(160, 369):
              if n <= len(lines):
                  print(f"{n:04d}: {lines[n-1]}")
          print("=== END_LOAD_HOUSE_EXACT_CONTEXT ===")

          print("=== CUSTOM_HOUSE_HANDLER_INDEX ===")
          print("SOURCE_SHA256",server_sha)
          for line,name,kind in starts:
              print("HANDLER",line,kind,name)
          print("HANDLER_COUNT",len(starts))
          print("=== END_CUSTOM_HOUSE_HANDLER_INDEX ===")

          for idx,(line,name,kind) in enumerate(starts):
              next_line=starts[idx+1][0]-1 if idx+1<len(starts) else len(lines)
              start=max(1,line-18)
              end=min(len(lines),max(line+95,next_line))
              print(f"=== CUSTOM_HOUSE_HANDLER {kind} {name} line={line} ===")
              for n in range(start,end+1):
                  print(f"{n:04d}: {lines[n-1]}")
              print("=== END_CUSTOM_HOUSE_HANDLER ===")

          # Client / other-server call sites for the exact remotes.
          print("=== CUSTOM_HOUSE_REMOTE_REFS ===")
          for item,path in walk(root):
              cls=item.attrib.get("class","")
              if cls not in script_classes:
                  continue
              source=prop_text(item,"Source")
              if not source or path==server_target:
                  continue
              src_lines=source.splitlines()
              hits=[]
              for i,line in enumerate(src_lines,1):
                  if any(("RemoteFunctions."+name) in line for name in house_remote_names):
                      hits.append(i)
              if not hits:
                  continue
              print("REF_SCRIPT",cls,path)
              shown=set()
              for center in hits:
                  for n in range(max(1,center-12),min(len(src_lines),center+18)+1):
                      if n in shown:
                          continue
                      shown.add(n)
                      print(f"{n:04d}: {src_lines[n-1]}")
                  print("---")
          print("=== END_CUSTOM_HOUSE_REMOTE_REFS ===")

          # Inventory likely player house/furniture server objects.
          print("=== HOUSE_FURNITURE_INSTANCE_PATHS ===")
          count=0
          for item,path in walk(root):
              nm=item_name(item).lower()
              if any(token in nm for token in ("furni_","house","home")) and (
                  path.startswith("ServerStorage/") or
                  path.startswith("ReplicatedStorage/") or
                  path.startswith("Workspace/")
              ):
                  print("INSTANCE",item.attrib.get("class",""),path)
                  count+=1
                  if count>=600:
                      break
          print("INSTANCE_COUNT_PRINTED",count)
          print("=== END_HOUSE_FURNITURE_INSTANCE_PATHS ===")
          PY
