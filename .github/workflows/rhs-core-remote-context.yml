name: RHS Core Remote Context

on:
  push:
    branches:
      - rebuild/rhs-licensed-exact
    paths:
      - ".github/workflows/rhs-core-remote-context.yml"

permissions:
  contents: read

jobs:
  context:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify pinned working build
        run: python3 scripts/verify-rhs-baseline.py

      - name: Build pinned Roblox converter
        shell: bash
        run: |
          set -euo pipefail
          cargo install --git https://github.com/rojo-rbx/rbx-dom.git \
            --rev 43d1f129f2eb1fd055512f039863ff35ae5a10f1 \
            --locked rbx_util

      - name: Convert working build
        run: rbx-util convert "rhs/working/ROBLOX High School.rbxl" /tmp/rhs-working.rbxlx

      - name: Print core remote contexts
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import xml.etree.ElementTree as ET

          root = ET.parse("/tmp/rhs-working.rbxlx").getroot()
          targets = {
              "ServerScriptService/ApartmentPurchaseScript": [1, 3],
              "ServerScriptService/OutfitHandler": [1, 40, 80, 120, 160, 200, 230, 243, 260, 274, 300],
              "ServerScriptService/DataStoresScript": [1310, 1320, 1330, 1340],
          }

          def prop_text(item, name):
              props = item.find("Properties")
              if props is None:
                  return ""
              for p in props:
                  if p.attrib.get("name") == name:
                      if p.tag == "Content":
                          child = next(iter(p), None)
                          return (child.text or "") if child is not None else ""
                      return p.text or ""
              return ""

          def item_name(item):
              return prop_text(item, "Name") or "(unnamed)"

          def walk(parent, prefix=""):
              for item in parent.findall("Item"):
                  name = item_name(item).replace("/", "_")
                  path = f"{prefix}/{name}" if prefix else name
                  yield item, path
                  yield from walk(item, path)

          found = set()
          apartment_instances = []
          apartment_purchase_refs = []
          outfit_refs = []
          selected_apartment_refs = []
          outfit_input_instances = []

          for item, path in walk(root):
              item_class = item.attrib.get("class", "")
              item_nm = item_name(item)
              if item_nm == "Apartment" or "Apartment" in path:
                  apartment_instances.append((item_class, path))
              if (
                  "StarterGui/LoadableGuis/Outfits" in path
                  and "/Inputs/" in path
              ):
                  outfit_input_instances.append((item_class, path, item_nm))

              if item_class in {"Script", "LocalScript", "ModuleScript"}:
                  source = prop_text(item, "Source")
                  if "ApartmentPurchase" in source:
                      apartment_purchase_refs.append((item_class, path, source))
                  if "WearOutfit" in source or "SaveOutfit" in source:
                      outfit_refs.append((item_class, path, source))
                  if "SelectedApartment" in source or "RentApartment" in source:
                      selected_apartment_refs.append((item_class, path, source))

              if path not in targets:
                  continue
              source = prop_text(item, "Source")
              lines = source.splitlines()
              sha = hashlib.sha256(source.encode("utf-8")).hexdigest()
              print(f"=== CORE_REMOTE_SCRIPT {path} class={item.attrib.get('class')} source_sha256={sha} lines={len(lines)} ===")
              shown = set()
              for center in targets[path]:
                  for i in range(max(1, center - 70), min(len(lines), center + 90) + 1):
                      if i in shown:
                          continue
                      shown.add(i)
                      print(f"{i:04d}: {lines[i-1]}")
              print("=== END_CORE_REMOTE_SCRIPT ===")
              found.add(path)

          print("=== APARTMENT_INSTANCE_PATHS ===")
          for cls, path in apartment_instances[:300]:
              print("APARTMENT_INSTANCE", cls, path)
          print("APARTMENT_INSTANCE_COUNT", len(apartment_instances))
          print("=== END_APARTMENT_INSTANCE_PATHS ===")

          def print_ref_block(label, refs, needle):
              print(f"=== {label} ===")
              for cls, path, source in refs:
                  print(f"REF_SCRIPT {cls} {path}")
                  lines = source.splitlines()
                  for idx, line in enumerate(lines, 1):
                      if needle in line:
                          for n in range(max(1, idx - 10), min(len(lines), idx + 12) + 1):
                              print(f"{n:04d}: {lines[n-1]}")
                          print("---")
              print(f"=== END_{label} ===")

          print("=== OUTFIT_INPUT_INSTANCE_PATHS ===")
          for cls, path, nm in outfit_input_instances[:500]:
              print("OUTFIT_INPUT_INSTANCE", cls, path, "name=" + nm)
          print("OUTFIT_INPUT_INSTANCE_COUNT", len(outfit_input_instances))
          print("=== END_OUTFIT_INPUT_INSTANCE_PATHS ===")

          print_ref_block("APARTMENT_PURCHASE_REFS", apartment_purchase_refs, "ApartmentPurchase")
          print_ref_block("SELECTED_APARTMENT_REFS", selected_apartment_refs, "SelectedApartment")
          print_ref_block("OUTFIT_REMOTE_REFS", outfit_refs, "WearOutfit")

          missing = sorted(set(targets) - found)
          if missing:
              raise SystemExit("missing target scripts: " + ", ".join(missing))
          PY
