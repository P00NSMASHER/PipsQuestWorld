name: Restore last confirmed Emma classroom binary (v109 content)

# One-use emergency restoration. The first workflow-only commit is a dry
# verification run. Only a subsequent, separately authorized one-file marker
# commit may publish the byte-for-byte verified earlier classroom.
on:
  push:
    branches:
      - rollback/emma-restore-v109-20261020-d88ec24
    paths:
      - '.github/workflows/restore-emma-last-confirmed-v109-20261020.yml'
      - 'school/emma-classroom/RESTORE_V109_REQUEST_20261020'

permissions:
  contents: read

concurrency:
  group: publish-emma-classroom
  cancel-in-progress: false

jobs:
  verify-and-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      SOURCE_SHA: d88ec24bdb51b3f4fba658e8bfd7a513009df433
      EXPECTED_RBXL_SHA256: 6c6fee07f572d76ec9b171a889467524841feeac5786ebc4f0ea72983fdd1829
      KNOWN_PREVIEW_VERSION: '113'
      PREVIOUS_PUBLISHED_VERSION: '109'
      UNIVERSE_ID: '10769455759'
      PLACE_ID: '114603280760042'
      WORKFLOW_PATH: .github/workflows/restore-emma-last-confirmed-v109-20261020.yml
      MARKER_PATH: school/emma-classroom/RESTORE_V109_REQUEST_20261020
      ROLLBACK_BRANCH: rollback/emma-restore-v109-20261020-d88ec24
    steps:
      - name: Check out exact event commit with no persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false

      - name: Require fresh rollback authorization and unmodified previous product source
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'P00NSMASHER/PipsQuestWorld'
          test "$GITHUB_EVENT_NAME" = 'push'
          test "$GITHUB_REF_NAME" = "$ROLLBACK_BRANCH"
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$(git rev-parse "$SOURCE_SHA^{commit}")" = "$SOURCE_SHA"
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          parent="$(git rev-parse HEAD^)"
          if test "$changed" = "$WORKFLOW_PATH"; then
            test "$parent" = "$SOURCE_SHA"
            test ! -e "$MARKER_PATH"
            test "$(git diff --name-only "$SOURCE_SHA" HEAD)" = "$WORKFLOW_PATH"
            echo 'restore=false' >> "$GITHUB_OUTPUT"
            echo 'SAFE_REHEARSAL_ONLY_NO_ROBLOX_WRITE'
          elif test "$changed" = "$MARKER_PATH"; then
            test "$(git rev-parse HEAD^^)" = "$SOURCE_SHA"
            test "$(git diff-tree --no-commit-id --name-only -r HEAD^)" = "$WORKFLOW_PATH"
            if git cat-file -e "HEAD^:$MARKER_PATH" >/dev/null 2>&1; then
              echo 'REUSED_MARKER_REJECTED' >&2; exit 1
            fi
            test "$(git diff --name-only "$SOURCE_SHA" HEAD)" = "$(printf '%s\n%s' "$WORKFLOW_PATH" "$MARKER_PATH")"
            grep -qx 'requested-mode: restore-last-confirmed-classroom-v109-binary' "$MARKER_PATH"
            grep -qx 'authorization: user-approved-2026-10-20-revert-to-last-version' "$MARKER_PATH"
            grep -qx 'previous-published-version: 109' "$MARKER_PATH"
            grep -qx 'rejected-review-version: 113' "$MARKER_PATH"
            grep -qx 'product-source-sha: d88ec24bdb51b3f4fba658e8bfd7a513009df433' "$MARKER_PATH"
            grep -qx 'expected-rbxl-sha256: 6c6fee07f572d76ec9b171a889467524841feeac5786ebc4f0ea72983fdd1829' "$MARKER_PATH"
            grep -qx 'source-branch: rollback/emma-restore-v109-20261020-d88ec24' "$MARKER_PATH"
            grep -qx "source-parent-sha: $parent" "$MARKER_PATH"
            grep -qx 'target-universe: 10769455759' "$MARKER_PATH"
            grep -qx 'target-place: 114603280760042' "$MARKER_PATH"
            grep -qx 'build-project: school/emma-showroom.project.json' "$MARKER_PATH"
            grep -qx 'native-acceptance: remains-pending' "$MARKER_PATH"
            grep -qx 'release-acceptance: HOLD' "$MARKER_PATH"
            test "$(wc -l < "$MARKER_PATH" | tr -d ' ')" = '13'
            echo 'restore=true' >> "$GITHUB_OUTPUT"
            echo "FRESH_ONE_USE_ROLLBACK_AUTHORIZED_PREVIOUS_VERSION=$PREVIOUS_PUBLISHED_VERSION"
          else
            echo 'UNRECOGNIZED_ROLLBACK_TRIGGER_REJECTED' >&2
            exit 1
          fi
          echo "EXACT_PREVIOUS_PRODUCT_SOURCE_PIN=$SOURCE_SHA"
          echo "EXPECTED_OLD_BINARY_SHA256=$EXPECTED_RBXL_SHA256"
          echo 'Preserve original upload, release receipts and history; no source deletion or PR merge.' >> "$GITHUB_STEP_SUMMARY"

      - name: Install checksum-verified original Luau and Rojo tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tools/luau" "$RUNNER_TEMP/tools/rojo"
          cd "$RUNNER_TEMP/tools"
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 120 https://github.com/luau-lang/luau/releases/download/0.741/luau-ubuntu.zip -o luau.zip
          echo '134dc762ad26232af83e43f98dec03ff6030dd3a4452f9408b9d50ccea025503  luau.zip' | sha256sum -c -
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 120 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  rojo.zip' | sha256sum -c -
          unzip -q luau.zip -d luau
          unzip -q rojo.zip -d rojo
          chmod +x luau/luau luau/luau-compile rojo/rojo

      - name: Recheck original static and runtime behavior
        shell: bash
        run: |
          set -euo pipefail
          LUAU="$RUNNER_TEMP/tools/luau/luau"
          LUAUC="$RUNNER_TEMP/tools/luau/luau-compile"
          for file in school/emma-classroom/showroom/*.lua school/emma-classroom/server/StaffModel.lua school/emma-classroom/shared/Data.lua; do
            "$LUAUC" "$file" >/dev/null
          done
          python3 school/emma-classroom/showroom/verify_build.py
          python3 school/emma-classroom/showroom/audit_owner_polish.py --luau "$LUAU"
          python3 school/emma-classroom/tests/geometry_behavior.py --luau "$LUAU"
          python3 school/emma-classroom/showroom/audit_hallway_camera_layout.py --self-test
          python3 school/emma-classroom/showroom/audit_hallway_camera_layout.py --luau "$LUAU"
          python3 school/emma-classroom/showroom/audit_hallway_mobile_complexity.py --luau "$LUAU"
          python3 school/emma-classroom/showroom/audit_hallway_photo.py --luau "$LUAU"
          python3 school/emma-classroom/showroom/audit_left_hall_junction.py --luau "$LUAU"
          python3 school/emma-classroom/showroom/audit_glazed_door_aperture.py --luau "$LUAU"
          python3 school/emma-classroom/showroom/walkability_audit.py --self-test
          python3 school/emma-classroom/showroom/walkability_audit.py --luau "$LUAU" --out "$RUNNER_TEMP/navigation.json"
          grep -q 'ShowroomStationaryTeacher' school/emma-classroom/showroom/Main.server.lua
          grep -q 'CFrame.new(-11,3.15,-29)' school/emma-classroom/showroom/Main.server.lua
          grep -q 'PlacementContract.*Above hairline' school/emma-classroom/server/StaffModel.lua
          grep -q 'Enabled = false' school/emma-classroom/showroom/FurnitureMeshConfig.lua
          ! grep -q 'buildFoldingMat(' school/emma-classroom/showroom/Room.lua

      - name: Build and verify byte-identical previous published RBXL
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/tools/rojo/rojo" build school/emma-showroom.project.json -o "$RUNNER_TEMP/emma-last-confirmed-v109.rbxl"
          "$RUNNER_TEMP/tools/rojo/rojo" build school/emma-showroom.project.json -o "$RUNNER_TEMP/emma-last-confirmed-v109.rbxlx"
          test -s "$RUNNER_TEMP/emma-last-confirmed-v109.rbxl"
          python3 school/emma-classroom/showroom/verify_build.py "$RUNNER_TEMP/emma-last-confirmed-v109.rbxlx"
          sha256sum "$RUNNER_TEMP/emma-last-confirmed-v109.rbxl" | tee "$RUNNER_TEMP/rollback-place.sha256"
          printf '%s  %s\n' "$EXPECTED_RBXL_SHA256" "$RUNNER_TEMP/emma-last-confirmed-v109.rbxl" | sha256sum --check --status
          echo "BYTE_IDENTICAL_PREVIOUS_PUBLISHED_BUILD_PASS $EXPECTED_RBXL_SHA256"
          printf '%s\n' "$SOURCE_SHA" > "$RUNNER_TEMP/original-product-source.txt"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/one-use-rollback-marker.txt"

      - name: Publish only the verified former binary to the existing Roblox place
        if: steps.gate.outputs.restore == 'true'
        id: rollback
        shell: bash
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$ROBLOX_API_KEY"
          response="$RUNNER_TEMP/rollback-response.json"
          http_code="$(curl --silent --show-error --location --output "$response" --write-out '%{http_code}' \
            --request POST \
            "https://apis.roblox.com/universes/v1/$UNIVERSE_ID/places/$PLACE_ID/versions?versionType=Published" \
            --header "x-api-key: $ROBLOX_API_KEY" \
            --header 'Content-Type: application/octet-stream' \
            --data-binary @"$RUNNER_TEMP/emma-last-confirmed-v109.rbxl")"
          test "$http_code" -ge 200 -a "$http_code" -lt 300
          version="$(python3 -c 'import json,sys; v=json.load(open(sys.argv[1]))["versionNumber"]; assert type(v) is int and v>113; print(v)' "$response")"
          printf '%s\n' "$version" > "$RUNNER_TEMP/rollback-version.txt"
          echo "ROLLED_BACK_TO_V109_CONTENT=new_version_$version sha256=$EXPECTED_RBXL_SHA256 source=$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'No native Studio/iPhone acceptance or new user-facing feature is implied.' >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve immutable rollback verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emma-last-confirmed-rollback-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/rollback-place.sha256
            ${{ runner.temp }}/original-product-source.txt
            ${{ runner.temp }}/one-use-rollback-marker.txt
            ${{ runner.temp }}/navigation.json
            ${{ runner.temp }}/rollback-response.json
            ${{ runner.temp }}/rollback-version.txt
          retention-days: 14
          if-no-files-found: warn
